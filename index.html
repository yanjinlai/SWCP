        ${r.note ? `<div class="card-hint" style="margin:2px 0 0;">備註：${escapeHtml(r.note)}</div>` : ''}
      </div>
      <span class="badge ${r.done?'badge-moss':'badge-amber'}" style="white-space:nowrap;">${r.done?'已處理':'未處理'}</span>
    </div>`).join('');

  return `
    <div class="card-top">
      <div>
        <div class="card-title">各案總覽</div>
      </div>
      <div class="cv-picker-stack">
        <select id="cvStatusFilter">
          <option value="進行中" ${caseViewStatusFilter==="進行中"?'selected':''}>執行中</option>
          <option value="暫停" ${caseViewStatusFilter==="暫停"?'selected':''}>暫停</option>
          <option value="已結案" ${caseViewStatusFilter==="已結案"?'selected':''}>已結案</option>
        </select>
        ${searchBoxHtml}
        ${caseDropdownHtml(dropdownList, caseViewSelectedId)}
        <button class="btn" id="cvAddCase">＋ 新增案件</button>

/* ============ 匯出 PDF（右上角帳號列「匯出PDF」彈跳視窗，可勾選各分頁要匯出的項目，A4直式、依畫面比例等比縮放，過長自動分頁） ============ */
let pdfExportTab = 'cases';
let pdfExportChecks = {
  cases: { closed:false },
  progress: { ongoing:false, paused:false },
  caseDetail: { basic:false, materials:false, progress:false, reminders:false, contacts:false },
  bonus: { target:false, detail:false, monthly:false, unpaid:false }
};
const PDF_EXPORT_ITEM_KEYS = {
  cases: ['closed'],
  progress: ['ongoing','paused'],
  caseDetail: ['basic','materials','progress','reminders','contacts'],
  bonus: ['target','detail','monthly','unpaid']
};

function pdfExportItemsHtml(tab){
  const rowHtml = (dataKey, label) => `<label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0;"><input type="checkbox" data-pdf-chk="${dataKey}" style="width:auto;" ${dataKey.split(':').reduce((o,k,i)=> i===0 ? pdfExportChecks[k] : o[k], null)?'checked':''}> ${label}</label>`;
  const selectAllChecked = PDF_EXPORT_ITEM_KEYS[tab] && PDF_EXPORT_ITEM_KEYS[tab].every(k=>pdfExportChecks[tab][k]);
  const selectAllHtml = `<label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0 10px; margin-bottom:6px; border-bottom:1px dashed var(--card-line); font-weight:700;"><input type="checkbox" data-pdf-selectall="${tab}" style="width:auto;" ${selectAllChecked?'checked':''}> 全選</label>`;
  if(tab==='cases'){
    return rowHtml('cases:closed','已結案案件');
  }
  if(tab==='progress'){
    return selectAllHtml
      + rowHtml('progress:ongoing','執行中案件（清單＋進度）')
      + rowHtml('progress:paused','暫停中案件（清單＋進度）');
  }
  if(tab==='caseDetail'){
    const cc = state.cases.find(x=>x.id===caseViewSelectedId);
    if(!cc){
      return `<div class="card-hint" style="margin:0;">尚未選擇案件，請先到「各案總覽」分頁點選一個案件後再回來匯出</div>`;
    }
    const label0 = `<div class="card-hint" style="margin:0 0 8px;">目前選定案件：<strong style="color:var(--ink);">${escapeHtml(cc.name||'（未命名案件）')}</strong></div>`;
    return label0
      + selectAllHtml
      + rowHtml('caseDetail:basic','基本資料')
      + rowHtml('caseDetail:materials','水保所需資料')
      + rowHtml('caseDetail:progress','工作進度')
      + rowHtml('caseDetail:reminders','備註提醒')
      + rowHtml('caseDetail:contacts','聯絡窗口');
  }
  if(tab==='bonus'){
    const isBonusOverview = bonusKpiYear === '總覽';
    if(isBonusOverview){
      return rowHtml('bonus:detail','已匯款獎金明細')
        + rowHtml('bonus:monthly','每月匯款總表');
    }
    return selectAllHtml
      + rowHtml('bonus:target',`${bonusKpiYear||''} 年度目標`)
      + rowHtml('bonus:detail','已匯款獎金明細')
      + rowHtml('bonus:monthly','每月匯款總表')
      + rowHtml('bonus:unpaid','尚未填匯款時間提醒');
  }
  return '';
}

function pdfExportModalHtml(errorMsg){
  const bonusEnabled = getSettings().bonusEnabled;
  if(pdfExportTab==='bonus' && !bonusEnabled) pdfExportTab = 'cases';
  const tabOptions = [
    ['cases','01 結案總表'],
    ['progress','02 進度總覽'],
    ['caseDetail','03 各案總覽（目前選定案件）'],
  ];
  if(bonusEnabled) tabOptions.push(['bonus','04 結案獎金']);
  const selectHtml = tabOptions.map(([v,l])=>`<option value="${v}" ${pdfExportTab===v?'selected':''}>${l}</option>`).join('');
  return `
    <div class="modal-overlay" id="pdfExportOverlay">
      <div class="modal-box" style="max-width:480px;">
        <div class="modal-title">匯出PDF</div>
        <div class="modal-row">
          <label>選擇分頁</label>
          <select id="pdfExportTabSelect">${selectHtml}</select>
        </div>
        <div id="pdfExportItemsWrap">${pdfExportItemsHtml(pdfExportTab)}</div>
        ${errorMsg ? `<div style="color:var(--deadline-red); font-size:12.5px; margin-top:10px; font-weight:700;">${escapeHtml(errorMsg)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost" id="pdfExportCancel">取消</button>
          <button class="btn" id="pdfExportGenerate">產生PDF</button>
        </div>
      </div>
    </div>`;
}
function openPdfExportModal(){
  document.getElementById('credModalArea').innerHTML = pdfExportModalHtml();
  bindPdfExportModal();
}
function closePdfExportModal(){
  document.getElementById('credModalArea').innerHTML = '';
}
function bindPdfExportModal(){
  document.getElementById('pdfExportCancel') && document.getElementById('pdfExportCancel').addEventListener('click', closePdfExportModal);
  document.getElementById('pdfExportOverlay') && document.getElementById('pdfExportOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'pdfExportOverlay') closePdfExportModal();
  });
  document.getElementById('pdfExportTabSelect') && document.getElementById('pdfExportTabSelect').addEventListener('change', (e)=>{
    pdfExportTab = e.target.value;
    document.getElementById('credModalArea').innerHTML = pdfExportModalHtml();
    bindPdfExportModal();
  });
  document.querySelectorAll('[data-pdf-chk]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const [tabKey, itemKey] = e.target.getAttribute('data-pdf-chk').split(':');
      pdfExportChecks[tabKey][itemKey] = e.target.checked;
      const selectAllEl = document.querySelector(`[data-pdf-selectall="${tabKey}"]`);
      if(selectAllEl){
        selectAllEl.checked = PDF_EXPORT_ITEM_KEYS[tabKey].every(k=>pdfExportChecks[tabKey][k]);
      }
    });
  });
  document.querySelectorAll('[data-pdf-selectall]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const tabKey = e.target.getAttribute('data-pdf-selectall');
      const checked = e.target.checked;
      PDF_EXPORT_ITEM_KEYS[tabKey].forEach(k=>{ pdfExportChecks[tabKey][k] = checked; });
      document.querySelectorAll(`[data-pdf-chk^="${tabKey}:"]`).forEach(chk=>{ chk.checked = checked; });
    });
  });
  const genBtn = document.getElementById('pdfExportGenerate');
  if(genBtn) genBtn.addEventListener('click', ()=> runPdfExport(genBtn));
}

/* 04結案獎金：把各區塊獨立出來，依勾選項目組合成PDF內容 */
function buildBonusExportHtml(opts){
  const years = getAvailableBonusYears();
  if(!bonusKpiYear || !(years.includes(bonusKpiYear) || bonusKpiYear === '總覽')) bonusKpiYear = years[0];
  const isOverview = bonusKpiYear === '總覽';
  const paidThisYear = state.cases
    .filter(c=> parseFloat(c.serviceFee) > 0 && c.paymentDate && (isOverview || c.paymentDate.slice(0,4)===bonusKpiYear))
    .slice()
    .sort((a,b)=> (a.approvalDraftDate||'').localeCompare(b.approvalDraftDate||''));
  let totalFee = 0;
  const rows = paidThisYear.map((c,i)=>{
    const fee = parseFloat(c.serviceFee) || 0;
    totalFee += fee;
    const bonus = fee * 0.04;
    return `<tr>
      <td class="readonly computed" style="text-align:center;">${i+1}</td>
      <td class="readonly" style="white-space:normal;">${formatCaseNameHtml(c.name)}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.caseType||'')}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.approvalDraftDate||'')}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.paymentDate||'')}</td>
      <td class="readonly" style="white-space:nowrap; text-align:right;">${fee ? fee.toLocaleString() : '－'}</td>
      <td class="readonly" style="white-space:nowrap; text-align:right;">${fee ? bonus.toLocaleString(undefined,{maximumFractionDigits:0}) : '－'}</td>
    </tr>`;
  }).join('');
  const totalBonus = totalFee * 0.04;
  const monthlyMap = {};
  paidThisYear.forEach(c=>{
    const month = c.paymentDate.slice(0,7);
    const bonus = (parseFloat(c.serviceFee) || 0) * 0.04;
    monthlyMap[month] = (monthlyMap[month] || 0) + bonus;
  });
  const monthKeys = Object.keys(monthlyMap).sort();
  const monthlyRows = monthKeys.map(m=>`<tr><td class="readonly">${m}</td><td class="readonly" style="text-align:right;">${monthlyMap[m].toLocaleString(undefined,{maximumFractionDigits:0})}</td></tr>`).join('');
  const unpaid = state.cases.filter(c=> c.status==="已結案" && parseFloat(c.serviceFee) > 0 && !c.paymentDate);
  const unpaidRows = unpaid.map(c=>`<tr>
    <td class="readonly" style="white-space:normal;">${formatCaseNameHtml(c.name)}</td>
    <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.approvalDraftDate||'')}</td>
    <td class="readonly" style="white-space:nowrap; text-align:right;">${(parseFloat(c.serviceFee)||0).toLocaleString()}</td>
  </tr>`).join('');
  const salary = parseFloat(getYearSalary(bonusKpiYear)) || 0;
  const kpiTarget = salary * 36;
  const completionRate = kpiTarget > 0 ? (totalFee / kpiTarget * 100) : 0;
  const sectionLabel = isOverview ? '總覽' : `${bonusKpiYear} 年度`;

  let html = `<div class="card-title" style="margin-bottom:16px;">結案獎金（${isOverview ? '總覽' : bonusKpiYear+'年度'}）</div>`;
  if(opts.target && !isOverview){
    html += `<div class="cv-section" style="margin-top:0; padding-top:0; border-top:none;">
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}目標</span></div>
      <div class="cv-formgrid">
        <div class="cv-field"><label>月薪（元）</label><input type="text" value="${salary ? salary.toLocaleString() : ''}" readonly></div>
        <div class="cv-field"><label>年度目標（元＝月薪×36）</label><input type="text" value="${kpiTarget ? kpiTarget.toLocaleString() : '－'}" readonly></div>
        <div class="cv-field"><label>本年度已匯款服務費總額（元）</label><input type="text" value="${totalFee.toLocaleString()}" readonly></div>
        <div class="cv-field"><label>完成率</label><input type="text" value="${kpiTarget ? completionRate.toFixed(1)+'%' : '尚未設定月薪'}" readonly style="font-weight:700; color:${completionRate>=100?'var(--moss)':'var(--amber)'};"></div>
      </div>
    </div>`;
  }
  if(opts.detail){
    html += `<div class="cv-section" ${(isOverview && !opts.target) ? 'style="margin-top:0; padding-top:0; border-top:none;"' : ''}>
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}已匯款獎金明細</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>編號</th><th>案名</th><th>案件類型</th><th>核定本日期</th><th>匯款時間</th><th style="text-align:right;">服務費（元）</th><th style="text-align:right;">結案獎金（元）</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="empty">尚無已匯款的案子</td></tr>`}</tbody>
        <tfoot><tr>
          <td class="readonly" colspan="2">${isOverview ? '總計' : '年度結案獎金總計'}</td><td class="readonly"></td><td class="readonly"></td><td class="readonly"></td>
          <td class="readonly" style="text-align:right;">${totalFee.toLocaleString()}</td>
          <td class="readonly" style="text-align:right; color:var(--moss);">${totalBonus.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
        </tr></tfoot>
      </table></div>
    </div>`;
  }
  if(opts.monthly){
    html += `<div class="cv-section">
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}每月匯款總表</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>月份</th><th style="text-align:right;">匯款金額（元）</th></tr></thead>
        <tbody>${monthlyRows || `<tr><td colspan="2" class="empty">尚無匯款紀錄</td></tr>`}</tbody>
      </table></div>
    </div>`;
  }
  if(opts.unpaid && !isOverview && unpaid.length){
    html += `<div class="cv-section">
      <div class="cv-section-head"><span class="cv-section-title">尚未填匯款時間（${unpaid.length}）</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>案名</th><th>核定本日期</th><th style="text-align:right;">服務費（元）</th></tr></thead>
        <tbody>${unpaidRows}</tbody>
      </table></div>
    </div>`;
  }
  return html;
}

async function runPdfExport(btn){
  const tab = pdfExportTab;
  const dateStr = todayLocalStr();
  let innerHtml = '', filename = '';

  if(tab==='cases'){
    const chk = pdfExportChecks.cases;
    if(!chk.closed){
      document.getElementById('credModalArea').innerHTML = pdfExportModalHtml('請至少勾選一個項目'); bindPdfExportModal(); return;
    }
    let closed = state.cases.filter(c=>c.status==='已結案');
    if(closedTypeFilter !== "總覽") closed = closed.filter(c => c.caseType === closedTypeFilter);
    if(closedCategoryFilter !== "總覽") closed = closed.filter(c => c.category === closedCategoryFilter);
    if(closedYearFilter !== "總覽") closed = closed.filter(c => c.actualClose && c.actualClose.slice(0,4) === closedYearFilter);
    innerHtml = `<div class="card-title" style="margin-bottom:16px;">結案總表</div>`;
    innerHtml += `<div class="cv-section" style="margin-top:0; padding-top:0; border-top:none;"><div class="cv-section-head"><span class="cv-section-title">已結案（${closed.length}）</span></div>${caseGroupTableClosed(closed, "此分類尚無已結案案件")}</div>`;
    filename = `結案總表_${dateStr}.pdf`;
  } else if(tab==='progress'){
    const chk = pdfExportChecks.progress;
    if(!chk.ongoing && !chk.paused){
      document.getElementById('credModalArea').innerHTML = pdfExportModalHtml('請至少勾選一個項目'); bindPdfExportModal(); return;
    }
    const ongoing = state.cases.filter(c=>c.status==='進行中');
    const paused = state.cases.filter(c=>c.status==='暫停');
    innerHtml = `<div class="card-title" style="margin-bottom:16px;">進度總覽</div>`;
    if(chk.ongoing) innerHtml += `<div class="cv-section" style="margin-top:0; padding-top:0; border-top:none;"><div class="cv-section-head"><span class="cv-section-title">執行中（${ongoing.length}）</span></div>${caseGroupTable(ongoing, "尚無執行中案件")}${ongoing.map(c=>progressCardHtmlForPdf(c)).join('')}</div>`;
    if(chk.paused) innerHtml += `<div class="cv-section"><div class="cv-section-head"><span class="cv-section-title">暫停中（${paused.length}）</span></div>${caseGroupTable(paused, "尚無暫停中案件")}${paused.map(c=>progressCardHtmlForPdf(c)).join('')}</div>`;
    filename = `進度總覽_${dateStr}.pdf`;
  } else if(tab==='caseDetail'){
    const cc = state.cases.find(x=>x.id===caseViewSelectedId);
    if(!cc){
      document.getElementById('credModalArea').innerHTML = pdfExportModalHtml('請先到「各案總覽」分頁選擇一個案件'); bindPdfExportModal(); return;
    }
    const chk = pdfExportChecks.caseDetail;
    const keys = ['basic','materials','progress','reminders','contacts'].filter(k=>chk[k]);
    if(keys.length===0){
      document.getElementById('credModalArea').innerHTML = pdfExportModalHtml('請至少勾選一個項目'); bindPdfExportModal(); return;
    }
    innerHtml = `<div class="card-title" style="margin-bottom:16px;">${escapeHtml(cc.name||'（未命名案件）')}</div>` + keys.map(k=>buildCaseSectionHtml(cc,k)).join('');
    const safeName = (cc.name||'各案總覽').replace(/[\\/:*?"<>|]/g,'_');
    filename = `${safeName}_${dateStr}.pdf`;
  } else if(tab==='bonus'){
    const chk = pdfExportChecks.bonus;
    if(!chk.target && !chk.detail && !chk.monthly && !chk.unpaid){
      document.getElementById('credModalArea').innerHTML = pdfExportModalHtml('請至少勾選一個項目'); bindPdfExportModal(); return;
    }
    innerHtml = buildBonusExportHtml(chk);
    filename = `結案獎金_${bonusKpiYear||''}_${dateStr}.pdf`;
  }

  let orientation = 'p';
  await exportHtmlToPdf(innerHtml, filename, btn, orientation);
  closePdfExportModal();
}

async function exportHtmlToPdf(innerHtml, filename, btn, orientation){
  orientation = orientation || 'p';
  if(!window.html2canvas || !window.jspdf){
    alert('PDF匯出元件尚未載入完成，請稍後再試一次');
    return;
  }
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '產生中…'; }
  const sandbox = document.createElement('div');
  sandbox.className = 'card';
  sandbox.style.cssText = 'position:fixed; left:-10000px; top:0; width:1136px; z-index:-1; padding:22px;';
  sandbox.innerHTML = innerHtml;
  document.body.appendChild(sandbox);
  document.body.classList.add('pdf-exporting');
  try{
    await new Promise(r=>setTimeout(r, 60)); // 等按鈕隱藏的樣式套用後再擷取畫面
    const canvas = await html2canvas(sandbox, {scale:2, backgroundColor:'#F5F1E8', useCORS:true});
    const imgWidthPx = canvas.width, imgHeightPx = canvas.height;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF(orientation, 'mm', 'a4');
    const pageWidthMm = pdf.internal.pageSize.getWidth();
    const pageHeightMm = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const usableWidthMm = pageWidthMm - margin * 2;
    const usableHeightMm = pageHeightMm - margin * 2;
    const pxPerMm = imgWidthPx / usableWidthMm; // 依畫面寬度等比換算，避免比例跟畫面差異太大
    const pageHeightPx = usableHeightMm * pxPerMm;
    let renderedPx = 0;
    let first = true;
    while(renderedPx < imgHeightPx){
      const sliceHeightPx = Math.min(pageHeightPx, imgHeightPx - renderedPx);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidthPx;
      pageCanvas.height = sliceHeightPx;
      pageCanvas.getContext('2d').drawImage(canvas, 0, renderedPx, imgWidthPx, sliceHeightPx, 0, 0, imgWidthPx, sliceHeightPx);
      const sliceData = pageCanvas.toDataURL('image/jpeg', 0.95);
      const sliceHeightMm = sliceHeightPx / pxPerMm;
      if(!first) pdf.addPage();
      pdf.addImage(sliceData, 'JPEG', margin, margin, usableWidthMm, sliceHeightMm);
      renderedPx += sliceHeightPx;
      first = false;
    }
    pdf.save(filename);
  }catch(e){
    alert('PDF匯出失敗，請重試：' + (e && e.message ? e.message : e));
  }finally{
    document.body.classList.remove('pdf-exporting');
    document.body.removeChild(sandbox);
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

function bindContactModal(){
  const byId = id => document.getElementById(id);
  const renderKeepModalScroll = ()=>{
    const box = document.querySelector('#contactModalOverlay .modal-box');
    const scrollTop = box ? box.scrollTop : 0;
    render();
    const newBox = document.querySelector('#contactModalOverlay .modal-box');
    if(newBox) newBox.scrollTop = scrollTop;
  };
  byId('cm_type') && byId('cm_type').addEventListener('change', e=>{
    contactDraft.type = e.target.value;
    renderKeepModalScroll();
  });
  const applyReviewAgencyAutofill = ()=>{
    if(contactDraft.type !== "審查單位") return;
    const key = (contactDraft.org||'').trim();
    if(!key) return;
    const profile = getReviewAgencyProfiles()[key];
    if(!profile) return;
    contactDraft.name = profile.name || '';
    contactDraft.phone = profile.phone || '';
    contactDraft.hasPhone = !!profile.hasPhone;
    contactDraft.lineId = profile.lineId || '';
    contactDraft.hasLine = !!profile.hasLine;
    contactDraft.email = profile.email || '';
    contactDraft.address = profile.address || '';
    renderKeepModalScroll();
    const el = document.getElementById('cm_org');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  };
  byId('cm_org') && byId('cm_org').addEventListener('input', e=>{
    contactDraft.org = e.target.value;
    if(e.isComposing) return; // 中文組字中，先不觸發自動帶入重繪，避免打斷輸入法
    applyReviewAgencyAutofill();
  });
  byId('cm_org') && byId('cm_org').addEventListener('compositionend', applyReviewAgencyAutofill);
  byId('cm_name') && byId('cm_name').addEventListener('input', e=>{ contactDraft.name = e.target.value; });
  byId('cm_phone') && byId('cm_phone').addEventListener('input', e=>{ contactDraft.phone = e.target.value; });
  byId('cm_lineId') && byId('cm_lineId').addEventListener('input', e=>{ contactDraft.lineId = e.target.value; });
  byId('cm_email') && byId('cm_email').addEventListener('input', e=>{ contactDraft.email = e.target.value; });
  byId('cm_address') && byId('cm_address').addEventListener('input', e=>{ contactDraft.address = e.target.value; });
  byId('cm_hasPhone') && byId('cm_hasPhone').addEventListener('change', e=>{
    contactDraft.hasPhone = e.target.checked;
    const wrap = byId('cm_phoneWrap'); if(wrap) wrap.style.display = e.target.checked ? '' : 'none';
  });
  byId('cm_hasLine') && byId('cm_hasLine').addEventListener('change', e=>{
    contactDraft.hasLine = e.target.checked;
    const wrap = byId('cm_lineWrap'); if(wrap) wrap.style.display = e.target.checked ? '' : 'none';
  });

  if(!contactDraft.committeeMembers) contactDraft.committeeMembers = [];
  byId('cmAddMember') && byId('cmAddMember').addEventListener('click', ()=>{
    contactDraft.committeeMembers.push({id:uid(), name:"", phone:"", email:"", address:""});
    renderKeepModalScroll();
  });
  document.querySelectorAll('.cm-member-name').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = contactDraft.committeeMembers.find(x=>x.id===inp.dataset.memberId);
      if(m) m.name = e.target.value;
    });
  });
  document.querySelectorAll('.cm-member-phone').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = contactDraft.committeeMembers.find(x=>x.id===inp.dataset.memberId);
      if(m) m.phone = e.target.value;
    });
  });
  document.querySelectorAll('.cm-member-email').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = contactDraft.committeeMembers.find(x=>x.id===inp.dataset.memberId);
      if(m) m.email = e.target.value;
    });
  });
  document.querySelectorAll('.cm-member-address').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = contactDraft.committeeMembers.find(x=>x.id===inp.dataset.memberId);
      if(m) m.address = e.target.value;
    });
  });
  document.querySelectorAll('[data-member-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      contactDraft.committeeMembers = contactDraft.committeeMembers.filter(x=>x.id!==btn.dataset.memberDel);
      renderKeepModalScroll();
    });
  });

  byId('cmCancel') && byId('cmCancel').addEventListener('click', ()=>{
    contactModalOpen = false;
    contactDraft = null;
    render();
  });
  byId('cmSave') && byId('cmSave').addEventListener('click', ()=>{
    if(contactDraft.type === "審查單位"){
      addReviewAgencyOption(contactDraft.org);
      saveReviewAgencyProfile(contactDraft);
    }
    const existingIdx = state.contacts.findIndex(x=>x.id===contactDraft.id);
    if(existingIdx >= 0){
      state.contacts[existingIdx] = Object.assign({}, contactDraft);
    } else {
      state.contacts.push(Object.assign({}, contactDraft));
    }
    touchCase(contactDraft.caseId);
    contactModalOpen = false;
    contactDraft = null;
    scheduleSave();
    render();
  });
}

  byId('bm_docNo') && byId('bm_docNo').addEventListener('input', e=>{ basicDraft.docNo = e.target.value; });
  byId('bm_serviceFee') && byId('bm_serviceFee').addEventListener('input', e=>{ basicDraft.serviceFee = formatMoneyInputLive(e.target); });
  byId('bm_paymentDate') && byId('bm_paymentDate').addEventListener('input', e=>{ basicDraft.paymentDate = e.target.value; });
  byId('addCategoryBtn') && byId('addCategoryBtn').addEventListener('click', ()=>{
    const inp = byId('newCategoryInput');
    const val = (inp.value||'').trim();
    if(!val) return;
    addCategoryOption(val);
    basicDraft.category = val;
    scheduleSave();
    render();
  });
  byId('deleteCategoryBtn') && byId('deleteCategoryBtn').addEventListener('click', ()=>{
    const sel = byId('bm_category');
    const val = sel ? sel.value : '';
    if(!val) return;
    removeCategoryOption(val);
    if(basicDraft.category === val) basicDraft.category = '';
    scheduleSave();
    render();
  });
  byId('bmCancel') && byId('bmCancel').addEventListener('click', ()=>{
    basicModalOpen = false; basicDraft = null; render();
  });
  byId('bmSave') && byId('bmSave').addEventListener('click', ()=>{
    const c = state.cases.find(x=>x.id===basicDraft.id);
    if(c){
      Object.assign(c, basicDraft);
      touchCase(c.id);
    }
    basicModalOpen = false; basicDraft = null;
    scheduleSave(); render();
  });
}

/* ============ 備註提醒：跳出視窗 ============ */
function timeSelectOptions(selectedHour){
  let hourOpts = '';
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0');
    hourOpts += `<option value="${hh}" ${hh===selectedHour?'selected':''}>${hh}</option>`;
  }
  return hourOpts;
}
function remindersModalHtml(c){
  const draft = remindersDraft;
  const rows = draft.items.map(r=>{
    const [rh, rm] = (r.time||'').split(':');
    return `
    <div class="modal-ext-row" data-id="${r.id}" style="flex-wrap:wrap; border:1px solid var(--card-line); border-radius:6px; padding:8px; margin-bottom:6px; justify-content:flex-start;">
      <div style="flex:1 1 60%; min-width:180px;">
        <label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px;">提醒內容</label>
        <input type="text" class="rd-text" data-id="${r.id}" value="${escapeHtml(r.text||'')}">
      </div>
      <div style="flex:0 0 150px;">
        <label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px;">提醒日期（選填）</label>
        <input type="date" class="rd-date" data-id="${r.id}" value="${r.date||''}">
      </div>
      <div style="flex:0 0 150px;">
        <label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px;">提醒時間（選填，24小時制）</label>
        <div style="display:flex; align-items:center; gap:4px;">
          <select class="rd-hour" data-id="${r.id}" style="min-width:64px;"><option value="">－</option>${timeSelectOptions(rh)}</select>
          <span>：</span>
          <select class="rd-min" data-id="${r.id}" style="min-width:64px;">
            <option value="">－</option>
            <option value="00" ${rm==='00'?'selected':''}>00</option>
            <option value="30" ${rm==='30'?'selected':''}>30</option>
          </select>
        </div>
      </div>
      <div style="flex:1 1 100%;">
        <label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px;">備註（選填）</label>
        <input type="text" class="rd-note" data-id="${r.id}" value="${escapeHtml(r.note||'')}">
      </div>
      <label style="display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); margin:6px 0 0;">
        <input type="checkbox" class="rd-done" data-id="${r.id}" ${r.done?'checked':''} style="width:auto;"> 已處理
      </label>
      <button class="rowdel" data-rd-del="${r.id}" title="刪除此筆" style="margin-left:auto; align-self:flex-start;">✕</button>
    </div>`;
  }).join('');
  return `
    <div class="modal-overlay" id="remindersModalOverlay">
      <div class="modal-box">
        <div class="modal-title">設定備註提醒</div>
        <div class="card-hint" style="margin-bottom:10px;">有填提醒日期的話，當天(或之後)登入系統會跳出通知，跟期限提醒是同一套機制；時間僅供參考顯示，不影響跳出時機</div>
        <div id="remindersDraftList">${rows || '<div class="card-hint" style="margin:0 0 8px;">尚無備註提醒</div>'}</div>
        <button class="btn ghost" id="rdAddBtn" style="margin-top:4px;">＋ 新增提醒</button>
        <div class="modal-actions">
          <button class="btn ghost" id="rdCancel">取消</button>
          <button class="btn" id="rdSave">儲存</button>
        </div>
      </div>
    </div>`;
}
function bindRemindersModal(){
  const byId = id => document.getElementById(id);
  document.querySelectorAll('.rd-text').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = remindersDraft.items.find(x=>x.id===inp.dataset.id);
      if(r) r.text = inp.value;
    });
  });
  document.querySelectorAll('.rd-date').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = remindersDraft.items.find(x=>x.id===inp.dataset.id);
      if(r) r.date = inp.value;
    });
  });
  document.querySelectorAll('.rd-hour, .rd-min').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const r = remindersDraft.items.find(x=>x.id===sel.dataset.id);
      if(!r) return;
      const hourSel = document.querySelector(`.rd-hour[data-id="${sel.dataset.id}"]`);
      const minSel = document.querySelector(`.rd-min[data-id="${sel.dataset.id}"]`);
      const h = hourSel ? hourSel.value : '';
      const m = minSel ? minSel.value : '';
      r.time = (h && m) ? `${h}:${m}` : '';
    });
  });
  document.querySelectorAll('.rd-note').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = remindersDraft.items.find(x=>x.id===inp.dataset.id);
      if(r) r.note = inp.value;
    });
  });
  document.querySelectorAll('.rd-done').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const r = remindersDraft.items.find(x=>x.id===cb.dataset.id);
      if(r) r.done = cb.checked;
    });
  });
  document.querySelectorAll('[data-rd-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      remindersDraft.items = remindersDraft.items.filter(x=>x.id!==btn.dataset.rdDel);
      render();
    });
  });
  byId('rdAddBtn') && byId('rdAddBtn').addEventListener('click', ()=>{
    remindersDraft.items.push({id:uid(), text:"", date:"", time:"", note:"", done:false});
    render();
  });
  byId('rdCancel') && byId('rdCancel').addEventListener('click', ()=>{
    remindersModalOpen = false; remindersDraft = null; render();
  });
  byId('rdSave') && byId('rdSave').addEventListener('click', ()=>{
    const caseId = remindersDraft.caseId;
    state.reminders = getReminders().filter(r=>r.caseId!==caseId).concat(
      remindersDraft.items.map(item=>({...item, caseId}))
    );
    remindersModalOpen = false; remindersDraft = null;
    scheduleSave(); render();
  });
}

function bindProgressModal(){
  const byId = id => document.getElementById(id);
  byId('pm_filingDate') && byId('pm_filingDate').addEventListener('input', e=>{ progressDraft.filingDate = e.target.value; });
  byId('pm_viewCopy') && byId('pm_viewCopy').addEventListener('input', e=>{ progressDraft.viewCopy = e.target.value; });
  byId('pm_finalCopy') && byId('pm_finalCopy').addEventListener('input', e=>{ progressDraft.finalCopy = e.target.value; });
  byId('pm_note') && byId('pm_note').addEventListener('input', e=>{ progressDraft.note = e.target.value; });

  [1,2,3].forEach(n=>{
    const reviewEl = byId('pm_review'+n);
    if(reviewEl) reviewEl.addEventListener('input', e=>{ progressDraft['review'+n] = e.target.value; });
    const deadlineEl = byId('pm_deadline'+n);
    if(deadlineEl) deadlineEl.addEventListener('input', e=>{ progressDraft['deadline'+n] = e.target.value; });
    const reviseEl = byId('pm_revise'+n);
    if(reviseEl) reviseEl.addEventListener('input', e=>{ progressDraft['revise'+n] = e.target.value; });
  });

  document.querySelectorAll('.pm-review-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      progressModalReviewTab = btn.dataset.reviewTab;
      render();
    });
  });

  if(!progressDraft.extensions) progressDraft.extensions = [];

  byId('pmAddExt') && byId('pmAddExt').addEventListener('click', ()=>{
    progressDraft.extensions.push({id:uid(), reviewNo:progressModalReviewTab, date:"", newDeadline:"", note:""});
    render();
  });
  document.querySelectorAll('.pm-ext-date').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const rec = progressDraft.extensions.find(x=>x.id===inp.dataset.extId);
      if(rec) rec.date = e.target.value;
    });
  });
  document.querySelectorAll('.pm-ext-newdeadline').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const rec = progressDraft.extensions.find(x=>x.id===inp.dataset.extId);
      if(rec) rec.newDeadline = e.target.value;
    });
  });
  document.querySelectorAll('[data-ext-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      progressDraft.extensions = progressDraft.extensions.filter(x=>x.id!==btn.dataset.extDel);
      render();
    });
  });

  byId('pmCancel') && byId('pmCancel').addEventListener('click', ()=>{
    progressModalOpen = false;
    progressDraft = null;
    render();
  });
  byId('pmSave') && byId('pmSave').addEventListener('click', ()=>{
    const caseId = progressDraft.caseId;
    const existingIdx = state.progress.findIndex(p => p.caseId === caseId);
    if(existingIdx >= 0){
      state.progress[existingIdx] = Object.assign({}, state.progress[existingIdx], progressDraft);
    } else {
      state.progress.push(progressDraft);
    }
    touchCase(caseId);
    progressModalOpen = false;
    progressDraft = null;
    scheduleSave();
    render();
  });
}

/* ============ 返回上一步：全域監聽 ============ */
document.addEventListener('focusin', (e)=>{
  if(!state) return;
  const tag = e.target.tagName;
  if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA'){
    maybeSnapshot();
  }
});
document.addEventListener('click', (e)=>{
  if(!state) return;
  const btn = e.target.closest('button');
  if(btn && btn.id !== 'undoBtn' && btn.id !== 'loginSubmit'){
    maybeSnapshot();
  }
});
document.getElementById('undoBtn').addEventListener('click', doUndo);
document.addEventListener('click', (e)=>{
  if(!caseDropdownOpen) return;
  if(e.target.closest('.cv-dropdown') || e.target.id === 'cvSearchInput') return;
  caseDropdownOpen = false;
  render();
});

(async function init(){
  document.getElementById('cardArea').innerHTML = `<div class="empty">載入中…</div>`;
  if(location.hash === '#admin'){
    renderAdminLogin();
    return;
  }
  await tryAutoLogin();
})();
</script>
