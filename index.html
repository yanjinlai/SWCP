<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水保計畫工作進度表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#EEF1EC;
  --card:#FBFAF8;
  --card-line:#DDE3DC;
  --ink:#1E3A4C;
  --ink-soft:#5B7078;
  --line:#C7D0CB;
  --teal:#3B6E68;
  --teal-soft:#DCE7E4;
  --amber:#B4812A;
  --amber-soft:#F3E7CE;
  --moss:#556E48;
  --moss-soft:#E2E9DA;
  --clay:#A64D28;
  --clay-soft:#F1DDD1;
  --deadline-red:#D7263D;
  --deadline-red-soft:#FBDCE0;
  --grey:#7C8781;
  --grey-soft:#E7EAE6;
  --input-bg:#FFFDF7;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  zoom:1.1;
  background:var(--paper);
  background-image:
    linear-gradient(var(--card-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--card-line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
  color:var(--ink);
  font-family:'Noto Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
  min-height:100vh;
  padding: 28px 20px 60px;
}

.wrap{max-width:1180px;margin:0 auto;}

/* ---------- header ---------- */
.header{margin-bottom:22px;}
.eyebrow{
  font-family:'Noto Serif TC', serif;
  font-size:11px;
  letter-spacing:0.16em;
  color:var(--teal);
  text-transform:uppercase;
  margin-bottom:6px;
}
h1{
  font-family:'Noto Serif TC', serif;
  font-weight:700;
  font-size:28px;
  color:var(--ink);
  margin:0 0 6px;
}
.subtitle{color:var(--ink-soft); font-size:13.5px;}
.savebar{
  font-family:'Noto Serif TC', serif;
  font-size:11px;
  color:var(--grey);
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.savebar .dot{width:6px;height:6px;border-radius:50%;background:var(--moss);display:inline-block;}
.savebar.saving .dot{background:var(--amber);}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; margin-top:24px; align-items:flex-end;}
.tab{
  font-family:'Noto Serif TC', serif;
  font-size:12px;
  background:#E3E8E2;
  color:var(--ink-soft);
  border:1px solid var(--card-line);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  padding:10px 16px 9px;
  cursor:pointer;
  opacity:0.8;
  transform:translateY(4px);
  transition:all .15s ease;
  display:flex; align-items:center; gap:8px;
}
.tab .idx{color:var(--teal); font-weight:600;}
.tab:hover{opacity:1;}
.tab.active{
  background:var(--card);
  color:var(--ink);
  opacity:1;
  transform:translateY(0);
  border-color:var(--card-line);
  font-weight:600;
  box-shadow:0 -2px 0 var(--amber) inset;
}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:0 8px 8px 8px;
  padding:22px;
  box-shadow:0 1px 3px rgba(30,58,76,0.06);
}
.card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.card-title{font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px; color:var(--ink);}
.card-hint{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.btn{
  font-family:'Noto Serif TC', serif;
  font-size:12px;
  font-weight:700;
  background:var(--ink);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:9px 14px;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:var(--teal);}
.btn.ghost{background:transparent; color:var(--clay); border:1px solid var(--clay-soft); font-weight:600;}
.btn.ghost:hover{background:var(--clay-soft);}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto; border:1px solid var(--card-line); border-radius:6px;}
table{border-collapse:collapse; width:100%; min-width:760px;}
thead th{
  background:var(--ink);
  color:#fff;
  font-family:'Noto Serif TC', serif;
  font-weight:600;
  font-size:11px;
  letter-spacing:0.03em;
  text-align:left;
  padding:9px 10px;
  white-space:nowrap;
  position:sticky; top:0;
}
tbody td, tfoot td{
  border-bottom:1px solid var(--card-line);
  border-right:1px solid #EFF2ED;
  padding:5px 6px;
  vertical-align:middle;
  background:var(--card);
  font-size:12px;
  line-height:1.4;
}
tfoot td{background:#F4F6F2;}
tbody tr:nth-child(even) td{background:#F4F6F2;}
tbody tr:hover td{background:var(--teal-soft);}

input[type=text], input[type=date], input[type=password], input[type=number], select, textarea{
  font-family:'Noto Serif TC', serif;
  font-size:12px;
  color:var(--ink);
  background:var(--input-bg);
  border:1px solid var(--card-line);
  border-radius:4px;
  padding:6px 7px;
  width:100%;
  min-width:88px;
}
textarea{
  resize:vertical;
  min-height:54px;
  line-height:1.45;
  white-space:normal;
  word-break:break-word;
  font-family:inherit;
}
input:focus, select:focus, textarea:focus{outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber);}
td.readonly{background:transparent !important;}
.computed{
  font-family:'Noto Serif TC', serif;
  font-size:11.5px;
  color:var(--teal);
}
.rowdel{
  background:none; border:none; color:var(--grey); cursor:pointer; font-size:15px; line-height:1;
  padding:4px 6px; border-radius:4px;
}
.rowdel:hover{color:var(--clay); background:var(--clay-soft);}

/* status badges */
.badge{
  display:inline-block; font-family:'Noto Serif TC', serif; font-size:10.5px; font-weight:600;
  padding:3px 8px; border-radius:999px; white-space:nowrap;
}
.badge-teal{background:var(--teal-soft); color:var(--teal);}
.badge-amber{background:var(--amber-soft); color:var(--amber);}
.badge-moss{background:var(--moss-soft); color:var(--moss);}
.badge-moss-solid{background:var(--moss); color:#fff;}
.badge-clay{background:var(--clay-soft); color:var(--clay);}
.badge-grey{background:var(--grey-soft); color:var(--grey);}
.line-badge{display:inline-block; background:#06C755; color:#fff; font-weight:700; font-size:10px; border-radius:4px; padding:1px 6px; letter-spacing:0.02em;}

/* progress ruler (signature element) */
.ruler{display:flex; align-items:center; gap:2px;}
.ruler .tick{width:9px; height:9px; border-radius:2px; background:var(--grey-soft); border:1px solid var(--card-line); flex:0 0 auto;}
.ruler .tick.done{background:var(--teal); border-color:var(--teal);}
.ruler .tick.now{background:var(--amber); border-color:var(--amber);}
.ruler-label{font-family:'Noto Serif TC', serif; font-size:11px; color:var(--ink-soft); margin-left:6px; white-space:nowrap;}

.empty{
  padding:30px 10px; text-align:center; color:var(--grey);
  font-family:'Noto Serif TC', serif; font-size:12px;
}

.legend{
  margin-top:16px; padding-top:14px; border-top:1px dashed var(--card-line);
  font-size:11.5px; color:var(--ink-soft); display:flex; gap:18px; flex-wrap:wrap;
}
.legend span.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle;}

/* ---------- 各案總覽 ---------- */
.cv-picker{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.cv-picker select{min-width:110px; font-size:13.5px; font-weight:600; padding:8px 10px;}
.cv-picker-stack{display:flex; flex-direction:column; align-items:stretch; gap:10px; flex:1 1 260px; min-width:0;}
.cv-picker-stack select{width:100%; font-size:13px; font-weight:600; padding:8px 10px;}
.cv-search-input{font-family:'Noto Serif TC', serif; font-size:13px; font-weight:600; color:var(--ink); background:var(--input-bg); border:1px solid var(--card-line); border-radius:4px; padding:8px 10px; width:100%;}
.cv-picker-stack > .btn{align-self:flex-start;}
.cv-detail-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 6px;}
.cv-detail-tabs .btn{font-size:11.5px; padding:7px 13px;}
.cv-dropdown{position:relative; width:100%;}
.cv-dropdown-toggle{
  font-family:'Noto Serif TC', serif; font-size:13px; font-weight:600; color:var(--ink);
  background:var(--input-bg); border:1px solid var(--card-line); border-radius:4px;
  padding:8px 10px; width:100%; text-align:left; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.cv-dropdown-toggle:hover{border-color:var(--teal);}
.cv-dropdown-panel{
  position:absolute; top:calc(100% + 10px); left:0; right:0; z-index:30;
  background:var(--card); border:1px solid var(--card-line); border-radius:6px;
  max-height:336px; overflow-y:auto; box-shadow:0 4px 14px rgba(30,58,76,0.18);
}
.cv-dropdown-item{padding:8px 10px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--card-line); white-space:normal;}
.cv-dropdown-item:last-child{border-bottom:none;}
.cv-dropdown-item:hover{background:var(--teal-soft);}
.cv-dropdown-item.selected{background:var(--amber-soft); font-weight:700;}
.cv-dropdown-empty{padding:10px; font-size:12px; color:var(--grey);}
.cv-summary{margin-top:14px;}
.cv-section{margin-top:22px; padding-top:18px; border-top:1px solid var(--card-line);}
.cv-section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.cv-section-title{font-family:'Noto Serif TC', serif; font-size:12px; letter-spacing:0.05em; color:var(--teal); text-transform:uppercase; font-weight:600;}
.cv-formgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:10px 12px;}
.cv-field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-family:'Noto Serif TC', serif;}
.cv-field.wide{grid-column:1 / -1;}

/* ---------- progress stepper ---------- */
.stepper{display:flex; align-items:flex-start; gap:2px; padding:6px 2px 2px; overflow-x:auto;}
.step{display:flex; flex-direction:column; align-items:center; flex:1; min-width:84px; position:relative;}
.step-line{position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--card-line); z-index:0;}
.step:first-child .step-line{display:none;}
.step.done .step-line{background:var(--teal);}
.step-dot{width:26px; height:26px; border-radius:50%; background:var(--card); border:2px solid var(--card-line); display:flex; align-items:center; justify-content:center; font-family:'Noto Serif TC', serif; font-size:11px; font-weight:600; color:var(--grey); z-index:1;}
.step.done .step-dot{background:var(--teal); border-color:var(--teal); color:#fff;}
.step.now .step-dot{background:var(--amber); border-color:var(--amber); color:#fff;}
.step.ext-step .step-dot{background:var(--amber-soft); border-color:var(--amber); color:var(--amber); font-weight:700;}
.step.ext-step.now .step-dot{background:var(--amber); border-color:var(--amber); color:#fff;}
.step.ext-step.done .step-line{background:var(--amber);}
.step-label{font-size:11px; color:var(--ink-soft); margin-top:6px; text-align:center; font-family:'Noto Serif TC', serif;}
.step-date{font-size:10.5px; color:var(--grey); margin-top:2px; text-align:center;}
.step-deadline{font-size:10px; color:var(--ink-soft); margin-top:3px; text-align:center; font-family:'Noto Serif TC', serif;}
.step-ext{font-size:10px; color:var(--amber); font-weight:700; margin-top:3px; text-align:center; background:var(--amber-soft); border-radius:4px; padding:1px 5px;}

/* PDF匯出專用進度條（純flexbox，不用position:absolute，避免html2canvas擷取時連接線跑位） */
.stepper-pdf{width:100%;}
.stepper-pdf-dots-row{display:flex; align-items:center;}
.stepper-pdf-unit{display:flex; align-items:center; flex:1; min-width:0;}
.stepper-pdf-connector{flex:1; height:2px; background:var(--card-line);}
.stepper-pdf-dot{width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-family:'Noto Serif TC', serif; font-size:11px; font-weight:600; color:var(--grey); background:var(--card); border:2px solid var(--card-line);}
.stepper-pdf-labels-row{display:flex; margin-top:6px;}
.stepper-pdf-label-col{flex:1; min-width:0; text-align:center; padding:0 3px;}
.stepper-pdf-label{font-size:11px; color:var(--ink-soft); text-align:center; font-family:'Noto Serif TC', serif;}
.stepper-pdf-sub{font-size:10.5px; color:var(--grey); margin-top:2px; text-align:center; font-family:'Noto Serif TC', serif;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(30,58,76,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
.modal-box{background:var(--card); border-radius:10px; padding:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.28);}
.modal-title{font-family:'Noto Serif TC', serif; font-weight:700; font-size:16px; color:var(--ink); margin-bottom:14px;}
.modal-row{margin-bottom:12px;}
.modal-row label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-family:'Noto Serif TC', serif;}
.modal-ext-row{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--ink-soft);}
.modal-ext-row input[type=checkbox]{width:auto;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--card-line);}

/* ---------- 手機版 RWD ---------- */
@media (max-width:640px){
  body{
    zoom:1;
    padding:16px 12px 48px;
    background-size:20px 20px;
  }
  .wrap{max-width:100%;}

  .header{margin-bottom:16px;}
  .eyebrow{font-size:10px;}
  h1{font-size:20px;}
  .subtitle{font-size:12px;}
  .savebar{font-size:10px;}

  .tabs{gap:6px; margin-top:16px; flex-wrap:wrap;}
  .tab{padding:8px 10px; font-size:11px; gap:5px;}
  .tab .idx{display:none;}
  .tab{white-space:pre-line;}
  .tab[data-tab="progressOverview"]{font-size:10px; padding-left:6px; padding-right:6px; letter-spacing:-0.3px; line-height:1.25;}

  #userInfo a{white-space:nowrap;}

  .card{padding:14px; border-radius:0 6px 6px 6px;}
  .card-top{gap:8px; margin-bottom:12px;}
  .card-title{font-size:15px;}
  .card-hint{font-size:11px;}

  .btn{padding:10px 14px; font-size:12px;}

  input[type=text], input[type=date], input[type=password], input[type=number], select, textarea{
    font-size:16px; /* 避免iOS Safari輸入框focus時自動放大畫面 */
    padding:8px 9px;
  }
  input[type=checkbox]{width:16px; height:16px;}
  .cv-search-input, .cv-picker-stack select, .cv-dropdown-toggle{font-size:15px;}

  .tbl-scroll{-webkit-overflow-scrolling:touch;}
  table{min-width:640px;}
  thead th{font-size:10px; padding:8px 8px;}
  tbody td, tfoot td{font-size:11px; padding:5px 5px;}

  .cv-formgrid{grid-template-columns:1fr; gap:10px;}
  .cv-detail-tabs{gap:5px;}
  .cv-detail-tabs .btn{font-size:11px; padding:6px 10px;}

  .stepper{gap:0; padding:6px 2px 2px;}
  .step{min-width:72px;}
  .step-label{font-size:10px;}
  .step-date, .step-deadline{font-size:9.5px;}

  .modal-overlay{padding:12px;}
  .modal-box{padding:16px; max-height:92vh;}
  .modal-title{font-size:15px; margin-bottom:10px;}
  .modal-actions{gap:6px; margin-top:14px; padding-top:10px;}
  .modal-actions .btn{flex:1; text-align:center;}

  .legend{gap:10px 14px; font-size:10.5px;}

  /* 休假紀錄／工作日誌 手機版精修 */
  .cv-section-head{flex-wrap:wrap; gap:8px;}
  .jn-card-head{flex-direction:column; align-items:flex-start !important; gap:8px;}
  .jn-card-head > div{width:100%;}
  .rwd-formrow{flex-direction:column; align-items:stretch !important; gap:12px;}
  .rwd-formrow > div{width:100% !important; max-width:none !important; min-width:0 !important;}
  .rwd-formrow input, .rwd-formrow select{width:100% !important; box-sizing:border-box;}
  .rwd-formrow .btn{width:100%;}
  .rwd-filterbar{flex-direction:column; align-items:stretch !important; gap:10px;}
  .rwd-filterbar > div{width:100% !important; min-width:0 !important;}
  .rwd-filterbar input, .rwd-filterbar select{width:100% !important; box-sizing:border-box;}

  .rwd-subtabs{gap:6px !important;}
  .rwd-subtabs .tab{flex:1 1 0; min-width:0; justify-content:center; padding:9px 4px !important; font-size:12px !important;}
}

@media (max-width:400px){
  h1{font-size:18px;}
  .tab{font-size:10px; padding:7px 8px;}
  .card{padding:11px;}
  table{min-width:560px;}
}

/* ---------- PDF匯出：擷取畫面時隱藏按鈕/互動控制項 ---------- */
body.pdf-exporting button{display:none !important;}
</style>

/* ============ 休假紀錄表：資料存取與計算 ============ */
function getLeave(){
  if(!state.leave) state.leave = {onboardDate:'', annual:[], other:[], overtime:[]};
  if(!state.leave.annual) state.leave.annual = [];
  if(!state.leave.other) state.leave.other = [];

  return state.leave;
}
const OTHER_LEAVE_TYPES = [['sick','病假'],['personal','事假'],['menstrual','生理假'],['comp','補休']];
/* 特休天數級距（勞基法）：滿半年3天／滿1年7天／滿2年10天／滿3年14天／滿5年15天／滿10年16天起每滿1年+1天，上限30天 */
function annualLeaveTierDays(svcYears){
  if(svcYears < 0.5) return 0;
  if(svcYears < 1) return 3;
  if(svcYears < 2) return 7;
  if(svcYears < 3) return 10;
  if(svcYears < 5) return 14;
  if(svcYears < 10) return 15;
  return Math.min(16 + Math.floor(svcYears - 10), 30);
}
/* 以逐日加權平均的方式，把「到職週年制」的級距換算成「曆年制」該年度可休天數估算值（四捨五入到0.5天） */
function calcAnnualEntitlement(onboardStr, year){
  if(!onboardStr) return 0;
  const onboard = new Date(onboardStr + 'T00:00:00');
  if(isNaN(onboard.getTime())) return 0;
  const isLeap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  const daysInYear = isLeap ? 366 : 365;
  let sum = 0;
  for(let i = 0; i < daysInYear; i++){
    const cur = new Date(year, 0, 1 + i);
    if(cur < onboard) continue;
    const svcYears = (cur - onboard) / (365.25 * 86400000);
    sum += annualLeaveTierDays(svcYears);
  }
  return Math.ceil(sum / daysInYear); /* 無條件進位到整天 */
}
function leaveDaysEquivalent(amount, unit){
  const n = parseFloat(amount) || 0;
  return unit === 'hour' ? n / 8 : n; /* 以每日8小時折算 */
}
function annualUsedForYear(year){
  return getLeave().annual.filter(r => (r.date||'').startsWith(String(year)))
    .reduce((s,r) => s + leaveDaysEquivalent(r.amount, r.unit), 0);
}
function overtimeHoursTotal(){
  return getLeave().overtime.reduce((s,r) => s + (parseFloat(r.hours)||0), 0);
}
function compUsedHoursTotal(){
  return getLeave().other.filter(r => r.type === 'comp')
    .reduce((s,r) => s + (r.unit === 'hour' ? (parseFloat(r.amount)||0) : (parseFloat(r.amount)||0) * 8), 0);
}
function overtimeBalanceHours(){
  return Math.round((overtimeHoursTotal() - compUsedHoursTotal()) * 2) / 2;
}
/* 加班時數／補休以「年度」呈現但不歸零：前一年12/31沒用完的餘額，會結轉到隔年年初繼續使用 */
function overtimeEarnedInYear(year){
  return getLeave().overtime.filter(r => (r.date||'').slice(0,4) === String(year))
    .reduce((s,r) => s + (parseFloat(r.hours)||0), 0);
}
function overtimeEarnedBeforeYear(year){
  return getLeave().overtime.filter(r => (r.date||'').slice(0,4) && (r.date||'').slice(0,4) < String(year))
    .reduce((s,r) => s + (parseFloat(r.hours)||0), 0);
}
function compUsedInYear(year){
  return getLeave().other.filter(r => r.type === 'comp' && (r.date||'').slice(0,4) === String(year))
    .reduce((s,r) => s + (r.unit === 'hour' ? (parseFloat(r.amount)||0) : (parseFloat(r.amount)||0) * 8), 0);
}
function compUsedBeforeYear(year){
  return getLeave().other.filter(r => r.type === 'comp' && (r.date||'').slice(0,4) && (r.date||'').slice(0,4) < String(year))
    .reduce((s,r) => s + (r.unit === 'hour' ? (parseFloat(r.amount)||0) : (parseFloat(r.amount)||0) * 8), 0);
}
function overtimeCarryInForYear(year){
  return Math.round((overtimeEarnedBeforeYear(year) - compUsedBeforeYear(year)) * 2) / 2;
}
function overtimeYearEndBalance(year){
  return Math.round((overtimeCarryInForYear(year) + overtimeEarnedInYear(year) - compUsedInYear(year)) * 2) / 2;
}

function getJournalEntries(){
  if(!state.journalEntries){
    const entries = [];
    const byCase = new Map();
    const pushLines = (caseName, content) => {
      const name = (caseName||'').trim() || '（未命名）';
      let e = byCase.get(name);
      if(!e){ e = {id:uid(), caseName:name, items:[]}; byCase.set(name, e); entries.push(e); }
      String(content||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
        e.items.push({id:uid(), text:line});
      });
    };
    // 相容舊版本資料格式，自動搬遷一次
    if(Array.isArray(state.journalItems)){
      state.journalItems.forEach(it => pushLines(it.caseName, it.content));
      delete state.journalItems;
    } else if(Array.isArray(state.journal)){
      state.journal.forEach(dayEntry => (dayEntry.items||[]).forEach(it => pushLines(it.caseName, it.content)));
      delete state.journal;
    }
    state.journalEntries = entries;
  }
  return state.journalEntries;
}

function getReviewAgencyOptions(){
  if(!state.reviewAgencyOptions) state.reviewAgencyOptions = [];
  DEFAULT_REVIEW_AGENCIES.forEach(a=>{
    if(!state.reviewAgencyOptions.includes(a.name)) state.reviewAgencyOptions.push(a.name);
  });
  const order = DEFAULT_REVIEW_AGENCIES.map(a=>a.name);
  state.reviewAgencyOptions.sort((x,y)=>{
    const ix = order.indexOf(x), iy = order.indexOf(y);
    if(ix===-1 && iy===-1) return 0; // 都不是預設清單裡的，維持原本相對順序
    if(ix===-1) return 1;  // 使用者自行新增、不在預設地理清單裡的排最後
    if(iy===-1) return -1;
    return ix-iy; // 依地理位置(北到南)排序
  });
  return state.reviewAgencyOptions;
}

let undoStack = [];
let pendingSnapshot = true;
const MAX_UNDO = 20;

function maybeSnapshot(){
  if(pendingSnapshot && state){
    undoStack.push(JSON.stringify(state));
    if(undoStack.length > MAX_UNDO) undoStack.shift();
    pendingSnapshot = false;
    updateUndoButton();
  }
}
function updateUndoButton(){
  const btn = document.getElementById('undoBtn');
  if(!btn) return;
  btn.style.display = undoStack.length ? '' : 'none';
}
function doUndo(){
  if(!undoStack.length) return;
  const prev = undoStack.pop();
  state = JSON.parse(prev);
  pendingSnapshot = true;
  updateUndoButton();
  scheduleSave(true);
  render();
}

/* ============ 帳號（代號＋密碼）============ */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function renderAdminPanel(){
  document.getElementById('cardArea').innerHTML = `<div class="empty">載入中…</div>`;
  let entries = [];
  try{
    const snap = await db.ref('codes').once('value');
    if(snap.exists()){
      const val = snap.val();
      entries = Object.keys(val).map(key=>{
        const v = val[key];
        // 相容舊格式：舊資料的value直接是代號字串本身（沒有docId/updatedAt）
        if(typeof v === 'string'){
          return { key, code: v, docId: null, updatedAt: null };
        }
        return { key, code: v.code, docId: v.docId||null, updatedAt: v.updatedAt||null };
      });
      entries.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
    }
  }catch(e){
    document.getElementById('cardArea').innerHTML = `<div class="empty">讀取失敗，請確認網路連線後重新整理頁面重試</div>`;
    return;
  }
  document.getElementById('cardArea').innerHTML = adminPanelHtml(entries);
  bindAdminPanel();
}

function adminPanelHtml(entries){
  const rows = entries.map(e=>{
    const timeStr = e.updatedAt ? new Date(e.updatedAt).toLocaleString('zh-TW', {hour12:false}) : '（尚無登入紀錄，可能是舊資料）';

    return `<tr>
      <td class="readonly" style="font-weight:700;">${escapeHtml(e.code)}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(timeStr)}${noteStr}</td>

    </tr>`;
  }).join('');
  return `

      <tbody>${rows || `<tr><td colspan="3" class="empty">尚無任何已註冊代號</td></tr>`}</tbody>
    </table></div>`;
}

function bindAdminPanel(){
  document.getElementById('adminRefresh') && document.getElementById('adminRefresh').addEventListener('click', renderAdminPanel);
  document.getElementById('adminLogout') && document.getElementById('adminLogout').addEventListener('click', (e)=>{
    e.preventDefault();
    location.hash = '';
    renderLoginScreen();
  });
  document.querySelectorAll('[data-admin-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.getAttribute('data-admin-del');
      const code = btn.getAttribute('data-admin-del-code');
      const docId = btn.getAttribute('data-admin-del-docid');
      const confirmMsg = docId
        ? `確定要刪除代號「${code}」嗎？這會把該帳號的所有案件資料永久清除，無法復原。`
        : `確定要釋放代號「${code}」嗎？（這筆缺少帳號對應資訊，只會讓這個代號名稱可以被重新註冊，不會刪除任何案件資料）`;
      if(!confirm(confirmMsg)) return;
      btn.disabled = true; btn.textContent = '處理中…';
      try{
        await db.ref('codes/' + key).remove();
        if(docId) await db.ref('users/' + docId).remove();
        await renderAdminPanel();
      }catch(e){
        alert('刪除失敗，請確認網路連線後重試');

      }
    });
  });
}

      <div class="modal-row">

      </div>

        <label>密碼</label>
        <input type="password" id="loginPassword" placeholder="4～6位數字或簡單文字">

    </div>`;

function renderLoginScreen(errorMsg){
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('cardArea').innerHTML = loginScreenHtml(errorMsg);
  const submit = document.getElementById('loginSubmit');
  const codeEl = document.getElementById('loginCode');
  const pwEl = document.getElementById('loginPassword');
  const doSubmit = async () => {
    const code = (codeEl.value||'').trim();
    const pw = (pwEl.value||'').trim();
    if(!code || !pw){ renderLoginScreen('請輸入代號與密碼'); return; }
    submit.textContent = '登入中…'; submit.disabled = true;
    try{
      const docId = await sha256Hex(code + '::' + pw);
      const snap = await db.ref('users/' + docId).once('value');
      if(!snap.exists()){
        // 這組代號密碼還沒建立過帳號 → 檢查代號是否已被別人用（不同密碼）註冊過
        const taken = await isCodeTaken(code);
        if(taken){
          renderLoginScreen('這個代號已經有人使用，請確認密碼是否正確，或換一個代號');
          return;
        }
      }
      await enterWithDocId(docId, code);
    }catch(e){
      renderLoginScreen('登入失敗，請重試');
    }
  };
  submit.addEventListener('click', doSubmit);
  pwEl.addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); });
}

async function codeRegistryKey(code){
  return await sha256Hex('code::' + code);
}
async function isCodeTaken(code){
  const key = await codeRegistryKey(code);
  const snap = await db.ref('codes/' + key).once('value');
  return snap.exists();
}
async function registerCode(code, docId){
  const key = await codeRegistryKey(code);
  await db.ref('codes/' + key).set({ code, docId: docId||null, updatedAt: firebase.database.ServerValue.TIMESTAMP });
}
async function unregisterCode(code){
  const key = await codeRegistryKey(code);
  await db.ref('codes/' + key).remove();
}

async function enterWithDocId(docId, code){
  currentDocId = docId;
  currentUserCode = code;
  document.getElementById('cardArea').innerHTML = `<div class="empty">載入中…</div>`;
  try{
    const snap = await db.ref('users/' + docId).once('value');
    if(snap.exists()){
      const data = snap.val();
      state = data.state ? JSON.parse(data.state) : blankState();
      // 每次登入都重新登記代號→docId對應（順便更新最後登入時間），管理者頁面靠這個資料列出帳號清單
      await registerCode(code, docId);
    } else {
      state = blankState();
      await db.ref('users/' + docId).set({ state: JSON.stringify(state), updatedAt: firebase.database.ServerValue.TIMESTAMP });
      await registerCode(code, docId);
    }
    localStorage.setItem(LOCAL_KEY, JSON.stringify({docId, code}));
    renderUserInfoBar(code);
    undoStack = []; pendingSnapshot = true; updateUndoButton();
    render();
    checkDeadlineReminders();
  }catch(e){
    document.getElementById('cardArea').innerHTML = `<div class="empty">連線失敗，請確認網路連線後重新整理頁面重試</div>`;
  }
}

    <div class="rwd-formrow" style="display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px dashed var(--card-line); padding-bottom:16px;">

      <div style="flex:1; min-width:120px;"><label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px;">備註</label><input type="text" id="lv_overtimeNote"></div>
      <button class="btn" id="lv_overtimeAdd">＋ 新增</button>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>日期</th><th>時數</th><th>備註</th><th></th></tr></thead>

function bindLeaveView(){
  const byId = id => document.getElementById(id);
  if(!byId('lv_onboardDate')) return; // 目前不在此分頁，不需綁定
  byId('lv_onboardDate').addEventListener('change', e=>{
    getLeave().onboardDate = e.target.value;
    scheduleSave(true);
    render();
  });
  document.querySelectorAll('.lv-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      leaveViewTab = btn.getAttribute('data-lv-tab');
      render();
    });
  });
  document.querySelectorAll('.lv-note-edit').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const kind = inp.dataset.lvNoteKind, id = inp.dataset.lvNoteId;
      const arr = getLeave()[kind];
      const rec = arr && arr.find(r=>r.id===id);
      if(rec){ rec.note = inp.value; scheduleSave(); }
    });
  });

  if(leaveViewTab === 'annual'){
    byId('lv_year') && byId('lv_year').addEventListener('change', e=>{
      leaveViewYear = parseInt(e.target.value, 10);
      render();
    });
    byId('lv_annualUnit') && byId('lv_annualUnit').addEventListener('change', e=>{
      const isHour = e.target.value === 'hour';
      byId('lv_annualDayAmount').style.display = isHour ? 'none' : '';
      byId('lv_annualHourAmount').style.display = isHour ? '' : 'none';
    });
    byId('lv_annualAdd') && byId('lv_annualAdd').addEventListener('click', ()=>{
      const date = byId('lv_annualDate').value;
      if(!date){ alert('請選擇日期'); return; }
      if(getLeave().annual.some(r=>r.date===date)){ alert('這個日期已經有特休紀錄了，請選擇其他日期'); return; }
      const unit = byId('lv_annualUnit').value;
      const amount = unit === 'hour' ? byId('lv_annualHourAmount').value : byId('lv_annualDayAmount').value;
      if(!amount || parseFloat(amount) <= 0){ alert('請輸入天數或時數'); return; }
      const note = byId('lv_annualNote').value;
      getLeave().annual.push({id:uid(), date, amount, unit, note});
      leaveViewYear = parseInt(date.slice(0,4), 10);
      scheduleSave(true);
      render();
    });
    document.querySelectorAll('[data-lv-annual-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-lv-annual-del');
        getLeave().annual = getLeave().annual.filter(r=>r.id!==id);
        scheduleSave(true);
        render();
      });
    });
  } else if(leaveViewTab === 'other'){
    byId('lv_otherUnit') && byId('lv_otherUnit').addEventListener('change', e=>{
      const isHour = e.target.value === 'hour';
      byId('lv_otherDayAmount').style.display = isHour ? 'none' : '';
      byId('lv_otherHourAmount').style.display = isHour ? '' : 'none';
    });
    byId('lv_otherAdd') && byId('lv_otherAdd').addEventListener('click', ()=>{
      const date = byId('lv_otherDate').value;
      const type = byId('lv_otherType').value;
      if(!date){ alert('請選擇日期'); return; }
      if(getLeave().other.some(r=>r.date===date)){ alert('這個日期已經有請假紀錄了，請選擇其他日期'); return; }
      const unit = byId('lv_otherUnit').value;
      const amount = unit === 'hour' ? byId('lv_otherHourAmount').value : byId('lv_otherDayAmount').value;
      if(!amount || parseFloat(amount) <= 0){ alert('請輸入天數或時數'); return; }
      const note = byId('lv_otherNote').value;
      getLeave().other.push({id:uid(), type, date, amount, unit, note});
      scheduleSave(true);
      render();
    });
    document.querySelectorAll('[data-lv-other-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-lv-other-del');
        getLeave().other = getLeave().other.filter(r=>r.id!==id);
        scheduleSave(true);
        render();
      });
    });
  } else {
    byId('lv_overtimeYear') && byId('lv_overtimeYear').addEventListener('change', e=>{
      leaveViewYear = parseInt(e.target.value, 10);
      render();
    });
    byId('lv_overtimeAdd') && byId('lv_overtimeAdd').addEventListener('click', ()=>{
      const date = byId('lv_overtimeDate').value;
      const hours = byId('lv_overtimeHours').value;
      if(!date){ alert('請選擇日期'); return; }
      if(getLeave().overtime.some(r=>r.date===date)){ alert('這個日期已經有加班紀錄了，請選擇其他日期'); return; }
      if(!hours || parseFloat(hours) <= 0){ alert('請輸入時數'); return; }
      const note = byId('lv_overtimeNote').value;
      getLeave().overtime.push({id:uid(), date, hours, note});
      leaveViewYear = parseInt(date.slice(0,4), 10);
      scheduleSave(true);
      render();
    });
    document.querySelectorAll('[data-lv-overtime-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-lv-overtime-del');
        getLeave().overtime = getLeave().overtime.filter(r=>r.id!==id);
        scheduleSave(true);
        render();
      });
    });
  }
}

/* ============ 04 工作日誌（分頁，個人設定啟用後才顯示） ============ */
let journalModalOpen = false;
let journalDraft = null;
let journalDoneExpanded = false;

function journalEntryCardHtml(e){
  const itemsHtml = e.items.length
    ? `<ul style="margin:6px 0 0 20px; padding:0; font-size:13px; line-height:1.0; list-style:disc;">${e.items.map(it=>`<li style="margin-bottom:2px;">${escapeHtml(it.text)}</li>`).join('')}</ul>`
    : '<div class="card-hint" style="margin:4px 0 0;">尚無事項</div>';
  const dateLine = e.date ? `<div class="card-hint" style="margin:2px 0 0;">${escapeHtml(e.date)}</div>` : '';
  const noteHtml = e.note ? `<div style="margin-top:8px; padding-top:6px; border-top:1px dashed var(--card-line); font-size:12.5px; color:var(--ink-soft); white-space:pre-line;">備註：${escapeHtml(e.note)}</div>` : '';
  const completeBtn = e.completed
    ? `<button class="btn ghost" data-jn-uncomplete="${e.id}">↺ 取消完成</button>`
    : `<button class="btn ghost" data-jn-complete="${e.id}">✓ 已完成</button>`;
  const doneBadge = e.completed ? `<span class="badge badge-grey" style="margin-left:8px;">已完成</span>` : '';
  return `
    <div class="cv-section" style="margin-top:12px; padding-top:12px;">
      <div class="cv-section-head jn-card-head">
        <span class="cv-section-title" style="text-transform:none; display:inline-flex; align-items:center; gap:8px;"><span style="display:inline-block; background:var(--teal-soft); color:var(--ink); font-family:'Noto Serif TC', serif; font-size:14px; font-weight:700; padding:4px 12px; border-radius:6px;">${escapeHtml(e.caseName)}</span>${doneBadge}</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${completeBtn}
          <button class="btn ghost" data-jn-edit="${e.id}">⚙ 編輯</button>
          <button class="btn ghost" data-jn-del="${e.id}" style="color:var(--deadline-red);">刪除記錄</button>
        </div>
      </div>
      ${dateLine}
      ${itemsHtml}
      ${noteHtml}
    </div>`;
}

let journalFilterYear = 'all';
let journalFilterMonth = 'all';
let journalSearchQuery = '';

function journalView(){
  const allEntries = getJournalEntries();
  const years = Array.from(new Set(allEntries.map(e=>(e.date||'').slice(0,4)).filter(Boolean))).sort((a,b)=>b.localeCompare(a));
  const curYear = String(new Date().getFullYear());
  if(!years.includes(curYear)) years.unshift(curYear);

  const q = journalSearchQuery.trim().toLowerCase();
  const matchesFilter = e => {
    if(q){
      const hay = [e.caseName, e.note, ...(e.items||[]).map(it=>it.text)].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(!e.date) return true; // 沒填時間的記錄不受年度/月份篩選影響，一律顯示
    if(journalFilterYear !== 'all' && e.date.slice(0,4) !== journalFilterYear) return false;
    if(journalFilterMonth !== 'all' && e.date.slice(5,7) !== journalFilterMonth) return false;
    return true;
  };
  const entries = allEntries.filter(matchesFilter);
  const pending = entries.filter(e => !e.completed);
  const done = entries.filter(e => e.completed);
  const showDone = journalDoneExpanded || !!q; // 有搜尋內容時強制展開已完成，避免搜到的結果被收合藏起來

  const filterBar = `
    <div class="rwd-filterbar" style="display:flex; gap:10px; margin:0 0 16px; flex-wrap:wrap; align-items:flex-end;">
      <div><label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px; display:block;">年度</label>
        <select id="jnFilterYear">
          <option value="all" ${journalFilterYear==='all'?'selected':''}>全部</option>
          ${years.map(y=>`<option value="${y}" ${y===journalFilterYear?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div><label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px; display:block;">月份</label>
        <select id="jnFilterMonth">
          <option value="all" ${journalFilterMonth==='all'?'selected':''}>全部</option>
          ${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option value="${m}" ${m===journalFilterMonth?'selected':''}>${parseInt(m,10)}月</option>`).join('')}
        </select>
      </div>
      <div style="flex:1; min-width:160px;"><label style="font-size:10.5px; color:var(--ink-soft); margin:0 0 3px; display:block;">搜尋</label>
        <input type="text" id="jnSearchInput" value="${escapeHtml(journalSearchQuery)}" placeholder="搜尋案名、事項內容、備註">
      </div>
    </div>`;

  let body = '';
  if(allEntries.length === 0){
    body = '<div class="empty">尚無工作日誌，點右上角「＋設定工作日誌」開始記錄</div>';
  } else if(entries.length === 0){
    body = q ? '<div class="card-hint">找不到符合的工作日誌</div>' : '<div class="card-hint">這個年度/月份沒有工作日誌</div>';
  } else {
    body = pending.length ? pending.map(journalEntryCardHtml).join('') : '<div class="card-hint">目前沒有進行中的工作日誌</div>';
    if(done.length){
      body += `
      <div class="cv-section-head" style="margin-top:24px; padding:10px 12px; background:var(--grey-soft); border-radius:6px; border-top:none; cursor:pointer;" id="jnDoneToggle">
        <span class="cv-section-title">已完成（${done.length}）</span>
        <span style="color:var(--teal); font-size:12px; font-weight:600;">${showDone ? '收合 ▲' : '展開 ▼'}</span>
      </div>
      ${showDone ? done.map(journalEntryCardHtml).join('') : ''}`;
    }
  }

  return `
    <div class="card-top">
      <div><div class="card-title">工作日誌</div></div>
      <button class="btn" id="jnAddEntry">＋ 設定工作日誌</button>
    </div>
    ${allEntries.length ? filterBar : ''}
    ${body}
    ${journalModalOpen && journalDraft ? journalModalHtml() : ''}`;
}

function journalModalHtml(){
  const d = journalDraft;
  const rows = d.items.map((it,i) => `
    <div class="modal-ext-row" data-jn-item-row="${it.id}">
      <span style="width:20px; text-align:center; color:var(--ink-soft); font-size:14px; flex-shrink:0;">●</span>
      <input type="text" class="jn-item-input" data-jn-item-id="${it.id}" value="${escapeHtml(it.text)}" style="flex:1;">
      <button class="rowdel" data-jn-item-del="${it.id}" title="刪除此項">✕</button>
    </div>`).join('');
  return `
    <div class="modal-overlay" id="journalModalOverlay">
      <div class="modal-box">
        <div class="modal-title">設定工作日誌</div>
        <div class="modal-row">
          <label>案名</label>
          <input type="text" id="jn_caseName" list="journalCaseDatalist" value="${escapeHtml(d.caseName)}" placeholder="可自由輸入，或從既有案件挑選">
        </div>
        <datalist id="journalCaseDatalist">${(state.cases||[]).map(c=>`<option value="${escapeHtml(c.name)}">`).join('')}</datalist>
        <div class="modal-row">
          <label>時間</label>
          <input type="date" id="jn_date" value="${escapeHtml(d.date||'')}">
        </div>
        <label style="margin-top:10px; display:block;">處理事項</label>
        <div id="jnItemDraftList">${rows || '<div class="card-hint" style="margin:4px 0 8px;">尚無事項，請新增</div>'}</div>
        <button class="btn ghost" id="jnAddItem" style="margin-top:6px;">＋ 新增</button>
        <div class="modal-row" style="margin-top:14px;">
          <label>備註</label>
          <textarea id="jn_note" placeholder="其他補充說明">${escapeHtml(d.note||'')}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="jnCancel">取消</button>
          <button class="btn" id="jnSave">儲存</button>
        </div>
      </div>
    </div>`;
}

function bindJournalView(){
  const byId = id => document.getElementById(id);
  if(!byId('jnAddEntry')) return; // 目前不在此分頁，不需綁定
  byId('jnDoneToggle') && byId('jnDoneToggle').addEventListener('click', ()=>{
    journalDoneExpanded = !journalDoneExpanded;
    render();
  });
  byId('jnFilterYear') && byId('jnFilterYear').addEventListener('change', e=>{
    journalFilterYear = e.target.value;
    render();
  });
  byId('jnFilterMonth') && byId('jnFilterMonth').addEventListener('change', e=>{
    journalFilterMonth = e.target.value;
    render();
  });
  const jnSearchInputEl = byId('jnSearchInput');
  if(jnSearchInputEl){
    const applyJnSearch = ()=>{
      const el = document.getElementById('jnSearchInput');
      if(!el) return;
      journalSearchQuery = el.value;
      const pos = el.selectionStart;
      render();
      const el2 = document.getElementById('jnSearchInput');
      if(el2){ el2.focus(); el2.setSelectionRange(pos, pos); }
    };
    jnSearchInputEl.addEventListener('input', (e)=>{
      if(e.isComposing) return; // 中文注音/拼音組字中，先不重繪，避免打斷輸入法
      applyJnSearch();
    });
    jnSearchInputEl.addEventListener('compositionend', applyJnSearch);
  }
  byId('jnAddEntry').addEventListener('click', ()=>{
    journalDraft = {id:uid(), caseName:'', date:new Date().toISOString().slice(0,10), items:[{id:uid(), text:''}], note:'', completed:false};
    journalModalOpen = true;
    render();
  });
  document.querySelectorAll('[data-jn-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = getJournalEntries().find(e=>e.id===btn.getAttribute('data-jn-edit'));
      if(!entry) return;
      journalDraft = {id:entry.id, caseName:entry.caseName, date:entry.date||'', items: entry.items.map(it=>({id:it.id, text:it.text})), note:entry.note||'', completed: !!entry.completed};
      journalModalOpen = true;
      render();
    });
  });
  document.querySelectorAll('[data-jn-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-jn-del');
      const entry = getJournalEntries().find(e=>e.id===id);
      if(entry && confirm(`確定要刪除「${entry.caseName}」這筆工作日誌記錄嗎？`)){
        state.journalEntries = getJournalEntries().filter(e=>e.id!==id);
        scheduleSave(true);
        render();
      }
    });
  });
  document.querySelectorAll('[data-jn-complete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = getJournalEntries().find(e=>e.id===btn.getAttribute('data-jn-complete'));
      if(entry){ entry.completed = true; scheduleSave(true); render(); }
    });
  });
  document.querySelectorAll('[data-jn-uncomplete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const entry = getJournalEntries().find(e=>e.id===btn.getAttribute('data-jn-uncomplete'));
      if(entry){ entry.completed = false; scheduleSave(true); render(); }
    });
  });
  if(journalModalOpen && journalDraft){
    bindJournalModal();
  }
}

function bindJournalModal(){
  const byId = id => document.getElementById(id);
  byId('jn_caseName') && byId('jn_caseName').addEventListener('input', e=>{
    journalDraft.caseName = e.target.value;
  });
  byId('jn_date') && byId('jn_date').addEventListener('change', e=>{
    journalDraft.date = e.target.value;
  });
  byId('jn_note') && byId('jn_note').addEventListener('input', e=>{
    journalDraft.note = e.target.value;
  });
  document.querySelectorAll('.jn-item-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const item = journalDraft.items.find(x=>x.id===inp.dataset.jnItemId);
      if(item) item.text = inp.value;
    });
  });
  document.querySelectorAll('[data-jn-item-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      journalDraft.items = journalDraft.items.filter(x=>x.id!==btn.getAttribute('data-jn-item-del'));
      render();
    });
  });
  byId('jnAddItem') && byId('jnAddItem').addEventListener('click', ()=>{
    journalDraft.items.push({id:uid(), text:''});
    render();
  });
  byId('jnCancel') && byId('jnCancel').addEventListener('click', ()=>{
    journalModalOpen = false; journalDraft = null; render();
  });
  byId('jnSave') && byId('jnSave').addEventListener('click', ()=>{
    const caseName = (journalDraft.caseName||'').trim();
    if(!caseName){ alert('請輸入案名'); return; }
    const items = journalDraft.items.filter(it => (it.text||'').trim());
    const entries = getJournalEntries();
    const idx = entries.findIndex(e=>e.id===journalDraft.id);
    const rec = {id:journalDraft.id, caseName, date:journalDraft.date||'', items, note:(journalDraft.note||'').trim(), completed:!!journalDraft.completed};
    if(idx >= 0) entries[idx] = rec; else entries.push(rec);
    journalModalOpen = false; journalDraft = null;
    scheduleSave(true);
    render();
  });
}

function logout(){
  localStorage.removeItem(LOCAL_KEY);
  currentDocId = null; currentUserCode = null; state = null;
  undoStack = []; pendingSnapshot = true;
  document.getElementById('userInfo').innerHTML = '';
  updateUndoButton();
  renderLoginScreen();
}

/* ============ 更換代號／密碼 ============ */
function changeCredModalHtml(errorMsg, successMsg){

    <div class="modal-overlay" id="changeCredOverlay">

        <div class="modal-title">更換代號／密碼</div>
        <div class="card-hint" style="margin-bottom:14px;">請先輸入目前的代號與密碼確認身分，再設定新的代號與密碼。原本代號密碼輸入錯誤將無法更換。</div>
        ${errorMsg ? `<div style="color:var(--deadline-red); font-size:12.5px; margin-bottom:10px; font-weight:700;">${escapeHtml(errorMsg)}</div>` : ''}
        ${successMsg ? `<div style="color:var(--moss); font-size:12.5px; margin-bottom:10px; font-weight:700;">${escapeHtml(successMsg)}</div>` : ''}
        <div class="modal-row"><label>目前代號</label><input type="text" id="ccOldCode"></div>
        <div class="modal-row"><label>目前密碼</label><input type="password" id="ccOldPassword"></div>
        <div class="modal-row" style="border-top:1px dashed var(--card-line); padding-top:12px;"><label>新代號</label><input type="text" id="ccNewCode"></div>
        <div class="modal-row"><label>新密碼</label><input type="password" id="ccNewPassword"></div>
        <div class="modal-row"><label>再輸入一次新密碼</label><input type="password" id="ccNewPassword2"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="ccCancel">取消</button>
          <button class="btn" id="ccSubmit">確認更換</button>
        </div>
      </div>
    </div>`;
}
function openChangeCredModal(){
  document.getElementById('credModalArea').innerHTML = changeCredModalHtml();
  bindChangeCredModal();
}
function closeChangeCredModal(){
  document.getElementById('credModalArea').innerHTML = '';
}
function bindChangeCredModal(){
  document.getElementById('ccCancel') && document.getElementById('ccCancel').addEventListener('click', closeChangeCredModal);
  document.getElementById('changeCredOverlay') && document.getElementById('changeCredOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'changeCredOverlay') closeChangeCredModal();
  });
  document.getElementById('ccSubmit') && document.getElementById('ccSubmit').addEventListener('click', async ()=>{
    const oldCode = (document.getElementById('ccOldCode').value||'').trim();
    const oldPw = (document.getElementById('ccOldPassword').value||'').trim();
    const newCode = (document.getElementById('ccNewCode').value||'').trim();
    const newPw = (document.getElementById('ccNewPassword').value||'').trim();
    const newPw2 = (document.getElementById('ccNewPassword2').value||'').trim();
    if(!oldCode || !oldPw || !newCode || !newPw || !newPw2){
      document.getElementById('credModalArea').innerHTML = changeCredModalHtml('請完整填寫所有欄位');
      bindChangeCredModal();
      return;
    }
    if(newPw !== newPw2){
      document.getElementById('credModalArea').innerHTML = changeCredModalHtml('兩次輸入的新密碼不一致');
      bindChangeCredModal();
      return;
    }
    const oldCheckId = await sha256Hex(oldCode + '::' + oldPw);
    if(oldCheckId !== currentDocId){
      document.getElementById('credModalArea').innerHTML = changeCredModalHtml('原本代號或密碼錯誤，無法更換');
      bindChangeCredModal();
      return;
    }
    const newDocId = await sha256Hex(newCode + '::' + newPw);
    if(newDocId === currentDocId){
      document.getElementById('credModalArea').innerHTML = changeCredModalHtml('新的代號密碼組合跟原本相同，請換一組');
      bindChangeCredModal();
      return;
    }
    try{
      const snap = await db.ref('users/' + newDocId).once('value');
      if(snap.exists()){
        document.getElementById('credModalArea').innerHTML = changeCredModalHtml('這組新代號密碼已經被使用，請換一組');
        bindChangeCredModal();
        return;
      }
      if(newCode !== oldCode){
        const taken = await isCodeTaken(newCode);
        if(taken){
          document.getElementById('credModalArea').innerHTML = changeCredModalHtml('這個新代號已經有人使用，請換一個代號');
          bindChangeCredModal();
          return;
        }
      }
      await db.ref('users/' + newDocId).set({
        state: JSON.stringify(state),
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
      await db.ref('users/' + currentDocId).remove();
      if(newCode !== oldCode){
        await unregisterCode(oldCode);
      }
      await registerCode(newCode, newDocId);
      currentDocId = newDocId;
      currentUserCode = newCode;
      localStorage.setItem(LOCAL_KEY, JSON.stringify({docId:newDocId, code:newCode}));
      renderUserInfoBar(newCode);
      closeChangeCredModal();
    }catch(e){
      document.getElementById('credModalArea').innerHTML = changeCredModalHtml('更換失敗，請確認網路連線後重試');
      bindChangeCredModal();
    }
  });
}

function openDeleteAccountModal(){
  document.getElementById('credModalArea').innerHTML = deleteAccountModalHtml();
  bindDeleteAccountModal();
}
function closeDeleteAccountModal(){

}
function bindDeleteAccountModal(){
  document.getElementById('daCancel') && document.getElementById('daCancel').addEventListener('click', closeDeleteAccountModal);
  document.getElementById('deleteAccountOverlay') && document.getElementById('deleteAccountOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'deleteAccountOverlay') closeDeleteAccountModal();

function scheduleSave(immediate){
  const bar = document.getElementById('savebar');
  const txt = document.getElementById('saveText');
  bar.classList.add('saving'); txt.textContent = "儲存中…";
  clearTimeout(saveTimer);
  const doSave = async () => {
    if(!currentDocId) return;
    try{
      await db.ref('users/' + currentDocId).set({
        state: JSON.stringify(state),
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
      bar.classList.remove('saving');
      txt.textContent = "已儲存 " + new Date().toLocaleTimeString('zh-TW',{hour12:false});

      txt.textContent = "儲存失敗，請確認網路連線";

  };

/* ============ 小工具 ============ */
function caseName(id){

  return c ? c.name : "⚠ 案件已刪除";
}
function caseOptions(selectedId){
  if(state.cases.length===0) return '<option value="">請先於「結案總表」新增案名</option>';
  return state.cases.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
}
function selectOptions(list, selected){
  return list.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join('');
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatCaseNameHtml(name){
  if(!name) return '';
  const escaped = escapeHtml(name);
  return escaped.split('土地').join('土地<br>').replace(/<br>$/, '');
}
function formatMoneyDisplay(v){
  const raw = String(v||'').replace(/[^\d]/g, '');
  if(!raw) return '';
  return Number(raw).toLocaleString('en-US');
}
function formatMoneyInputLive(el){
  const raw = el.value.replace(/[^\d]/g, '');
  if(!raw){ el.value = ''; return ''; }
  const formatted = Number(raw).toLocaleString('en-US');
  const cursorFromEnd = el.value.length - el.selectionStart;
  el.value = formatted;
  const newPos = Math.max(0, formatted.length - cursorFromEnd);
  el.setSelectionRange(newPos, newPos);
  return raw;
}
function toROC(dateStr){
  if(!dateStr) return '';
  const parts = String(dateStr).split('-');
  if(parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10) - 1911;
  if(isNaN(y)) return dateStr;
  return `${y}年${parts[1]}月${parts[2]}日`;
}
function badgeClassCaseStatus(s){
  return s==="已結案" ? "badge-moss" : s==="暫停" ? "badge-grey" : "badge-amber";
}
function getProgressForCase(caseId){
  return state.progress.find(p => p.caseId === caseId) || null;
}
function blankProgress(caseId){
  return {id:uid(), caseId, filingDate:"", review1:"", deadline1:"", revise1:"", review2:"", deadline2:"", revise2:"", review3:"", deadline3:"", revise3:"", viewCopy:"", finalCopy:"", extensions:[], note:""};
}
function computeStageIndex(p){
  if(!p) return -1;
  if(p.finalCopy) return 5;
  if(p.viewCopy) return 4;
  if(p.review3) return 3;
  if(p.review2) return 2;
  if(p.review1) return 1;
  if(p.filingDate) return 0;
  return -1;
}
function rulerHtml(caseId){
  const p = getProgressForCase(caseId);
  const idx = computeStageIndex(p);
  let ticks = "";
  for(let i=0;i<STAGES.length;i++){
    let cls = "tick";
    if(idx>=0 && i<idx) cls += " done";
    else if(i===idx) cls += " now";
    ticks += `<span class="${cls}" title="${STAGES[i]}"></span>`;
  }
  const label = idx>=0 ? STAGES[idx] : "尚未開始";
  return `<span class="ruler">${ticks}</span><span class="ruler-label">${escapeHtml(label)}</span>`;
}

function buildProgressNodes(p){
  const nodes = [];
  if(!p) return nodes;
  if(p.filingDate) nodes.push({key:"filing", label:"掛件", date:p.filingDate, isExt:false});
  for(let n=1; n<=3; n++){
    const reviewDate = p["review"+n];
    if(!reviewDate) break; // 尚未進行到這一次審查，後面的也不會有
    nodes.push({key:"review"+n, label:"第"+n+"次審查", date:reviewDate, deadline:p["deadline"+n], revise:p["revise"+n], isExt:false});
    const exts = (p.extensions||[]).filter(x => String(x.reviewNo) === String(n));
    if(exts.length){
      let latestDocDate = "";
      let latestNewDeadline = "";
      exts.forEach(x=>{
        if(x.date && x.date > latestDocDate) latestDocDate = x.date;
        if(x.newDeadline && x.newDeadline > latestNewDeadline) latestNewDeadline = x.newDeadline;
      });
      nodes.push({key:"ext"+n, label:"展延", date:latestDocDate, newDeadline:latestNewDeadline, count:exts.length, isExt:true});
    }
    if(!p["revise"+n]) break; // 這次審查修正本尚未提送，還沒進到下一次審查
  }
  if(p.viewCopy) nodes.push({key:"view", label:"檢視本", date:p.viewCopy, isExt:false});
  if(p.finalCopy) nodes.push({key:"final", label:"定稿本", date:p.finalCopy, isExt:false});
  return nodes;
}

function progressBarHtml(p){
  const nodes = buildProgressNodes(p);
  if(nodes.length === 0){
    return `<div class="card-hint" style="margin:6px 0 0;">尚未開始（設定工作進度後會顯示到目前的階段）</div>`;
  }
  const watchInfo = getWatchDateForCase(p);
  const lastIdx = nodes.length - 1;
  const steps = nodes.map((node, i)=>{
    let cls = "step";
    if(node.isExt) cls += " ext-step";
    if(i < lastIdx) cls += " done";
    else cls += " now";
    const nodeReviewNo = node.key && node.key.indexOf('review')===0 ? node.key.replace('review','') : null;
    const isWatchedReview = watchInfo && nodeReviewNo && String(watchInfo.reviewNo)===String(nodeReviewNo);
    const dateIsWatched = isWatchedReview && watchInfo.kind === '審查日期';
    const deadlineIsWatched = isWatchedReview && watchInfo.kind === '修正期限';
    const dateStr = node.date ? `<div class="step-date" ${dateIsWatched?'style="color:var(--deadline-red); font-weight:700;"':''}>${escapeHtml(toROC(node.date))}</div>` : '';
    const deadlineStr = node.deadline ? `<div class="step-deadline" ${deadlineIsWatched?'style="color:var(--deadline-red); font-weight:700;"':''}>修正期限：${escapeHtml(toROC(node.deadline))}</div>` : '';
    const reviseStr = node.revise ? `<div class="step-date" style="color:var(--moss); font-weight:700;">修正本提送：${escapeHtml(toROC(node.revise))}</div>` : '';
    const extInfo = node.isExt
      ? `<div class="step-ext">共${node.count}筆展延${node.newDeadline ? '<br><span style="color:var(--deadline-red); font-weight:700;">新期限：'+escapeHtml(toROC(node.newDeadline))+'</span>' : ''}</div>`
      : '';
    const dotContent = node.isExt ? '延' : (nodes.slice(0,i+1).filter(x=>!x.isExt).length);
    return `<div class="${cls}"><div class="step-line"></div><div class="step-dot">${dotContent}</div><div class="step-label">${node.label}</div>${dateStr}${deadlineStr}${reviseStr}${extInfo}</div>`;
  }).join('');
  return `<div class="stepper">${steps}</div>`;
}

/* PDF匯出專用進度條：html2canvas對「絕對定位」的連接線支援不穩定，容易跑位，
   這裡改用「純flexbox、圓點置中、左右各半條連接線」的寫法，不用position:absolute，
   確保匯出成PDF時圓點永遠在上面、連接線不會跑掉 */
function progressBarHtmlForPdf(p){
  const nodes = buildProgressNodes(p);
  if(nodes.length === 0){
    return `<div class="card-hint" style="margin:6px 0 0;">尚未開始（設定工作進度後會顯示到目前的階段）</div>`;
  }
  const watchInfo = getWatchDateForCase(p);
  const lastIdx = nodes.length - 1;
  const dotColor = (node, isNow) => {
    if(node.isExt) return isNow ? 'background:var(--amber); border-color:var(--amber); color:#fff;' : 'background:var(--amber-soft); border-color:var(--amber); color:var(--amber); font-weight:700;';
    return isNow ? 'background:var(--amber); border-color:var(--amber); color:#fff;' : 'background:var(--teal); border-color:var(--teal); color:#fff;';
  };
  const lineColor = (node) => node.isExt ? 'var(--amber)' : 'var(--teal)';
  const dotsRow = nodes.map((node, i)=>{
    const isNow = i === lastIdx;
    const dotContent = node.isExt ? '延' : (nodes.slice(0,i+1).filter(x=>!x.isExt).length);
    // 左半線＝連接「前一個圓點→這個圓點」的路徑，用「這個節點」的顏色（呼應原本 .step.done .step-line 的邏輯）
    const leftLineStyle = i===0 ? 'background:transparent;' : `background:${lineColor(node)};`;
    // 右半線＝連接「這個圓點→下一個圓點」的路徑，用「下一個節點」的顏色，跟下一個節點的左半線同色，銜接起來才會是一整條線
    const rightLineStyle = i===lastIdx ? 'background:transparent;' : `background:${lineColor(nodes[i+1])};`;
    return `<div class="stepper-pdf-unit">
      <div class="stepper-pdf-connector" style="${leftLineStyle}"></div>
      <div class="stepper-pdf-dot" style="${dotColor(node, isNow)}">${dotContent}</div>
      <div class="stepper-pdf-connector" style="${rightLineStyle}"></div>
    </div>`;
  }).join('');
  const labelsRow = nodes.map((node, i)=>{
    const nodeReviewNo = node.key && node.key.indexOf('review')===0 ? node.key.replace('review','') : null;
    const isWatchedReview = watchInfo && nodeReviewNo && String(watchInfo.reviewNo)===String(nodeReviewNo);
    const dateIsWatched = isWatchedReview && watchInfo.kind === '審查日期';
    const deadlineIsWatched = isWatchedReview && watchInfo.kind === '修正期限';
    const labelStr = `<div class="stepper-pdf-label">${node.label}</div>`;
    const dateStr = node.date ? `<div class="stepper-pdf-sub" ${dateIsWatched?'style="color:var(--deadline-red); font-weight:700;"':''}>${escapeHtml(toROC(node.date))}</div>` : '';
    const deadlineStr = node.deadline ? `<div class="stepper-pdf-sub" ${deadlineIsWatched?'style="color:var(--deadline-red); font-weight:700;"':''}>修正期限：${escapeHtml(toROC(node.deadline))}</div>` : '';
    const reviseStr = node.revise ? `<div class="stepper-pdf-sub" style="color:var(--moss); font-weight:700;">修正本提送：${escapeHtml(toROC(node.revise))}</div>` : '';
    const extInfo = node.isExt
      ? `<div class="stepper-pdf-sub" style="color:var(--amber); font-weight:700;">共${node.count}筆展延${node.newDeadline ? '<br><span style="color:var(--deadline-red);">新期限：'+escapeHtml(toROC(node.newDeadline))+'</span>' : ''}</div>`
      : '';
    return `<div class="stepper-pdf-label-col">${labelStr}${dateStr}${deadlineStr}${reviseStr}${extInfo}</div>`;
  }).join('');
  return `<div class="stepper-pdf">
    <div class="stepper-pdf-dots-row">${dotsRow}</div>
    <div class="stepper-pdf-labels-row">${labelsRow}</div>
  </div>`;
}

function getActiveReviewNo(p){
  if(!p) return null;
  for(let n=1; n<=3; n++){
    if(p['review'+n] && !p['revise'+n]) return n;
  }
  return null;
}
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function toLocalDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayLocalStr(){
  return toLocalDateStr(new Date());
}
function businessDayBefore(dateStr){
  // 目標日期的前一天，若剛好落在週六／週日，繼續往前推到週五
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  while(d.getDay() === 0 || d.getDay() === 6){
    d.setDate(d.getDate() - 1);
  }
  return toLocalDateStr(d);
}
function isReminderActive(dateStr){
  if(!dateStr) return false;
  const todayStr = todayLocalStr();
  return todayStr >= businessDayBefore(dateStr);
}
function getWatchDateForCase(p){
  const n = getActiveReviewNo(p);
  if(!n) return null;
  const reviewDate = p['review'+n];
  const baseDeadline = p['deadline'+n];
  const exts = (p.extensions||[]).filter(x=>String(x.reviewNo)===String(n));
  let latestNewDeadline = '';
  exts.forEach(x=>{ if(x.newDeadline && x.newDeadline > latestNewDeadline) latestNewDeadline = x.newDeadline; });
  // 優先序：目前進度最新的日期為主 → 最新展延期限 > 修正期限 > 審查日期本身
  if(latestNewDeadline) return {reviewNo:n, date:latestNewDeadline, kind:'展延期限'};
  if(baseDeadline) return {reviewNo:n, date:baseDeadline, kind:'修正期限'};
  if(reviewDate) return {reviewNo:n, date:reviewDate, kind:'審查日期'};
  return null;
}
function computeDueSoonList(){
  const list = [];
  state.cases.filter(c=>c.status==="進行中" || c.status==="暫停").forEach(c=>{
    const p = getProgressForCase(c.id);
    const info = getWatchDateForCase(p);
    if(!info) return;
    if(!isReminderActive(info.date)) return;
    const ack = p.ackWatch;
    if(ack && String(ack.reviewNo)===String(info.reviewNo) && ack.date===info.date) return;
    list.push({type:'watch', caseId:c.id, caseName:c.name, reviewNo:info.reviewNo, date:info.date, kind:info.kind, days:daysUntil(info.date)});
  });
  return list;
}
function computeReminderNoticeList(){
  const list = [];
  getReminders().forEach(r=>{
    if(r.done || !r.date) return;
    if(!isReminderActive(r.date)) return;
    const c = state.cases.find(x=>x.id===r.caseId);
    list.push({type:'reminder', id:r.id, caseId:r.caseId, caseName:c?c.name:'（案件已刪除）', text:r.text||'（未填寫內容）', date:r.date, time:r.time||'', days:daysUntil(r.date)});
  });
  return list;
}
let deadlineNoticeList = [];
function deadlineNoticeHtml(list){

    if(item.type === 'reminder'){

          <span class="badge badge-teal" style="margin-bottom:4px;">備註提醒</span>
          <div style="font-weight:700; font-size:13px; margin-top:4px;">${escapeHtml(item.caseName)}</div>
          <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${escapeHtml(item.text)}</div>
          <div style="font-size:12px; font-weight:700; color:var(--deadline-red); margin-top:2px;">${statusText}（${escapeHtml(toROC(item.date))}${item.time ? ' '+escapeHtml(item.time) : ''}）</div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn ghost" data-goto-case="${item.caseId}" style="padding:5px 10px; font-size:11.5px;">前往查看</button>
            <button class="btn" data-ack-reminder="${item.id}" style="padding:5px 10px; font-size:11.5px;">✓ 已處理完成</button>
          </div>
        </div>`;
    }
    if(item.type === 'watch'){
      const statusText = item.days < 0 ? `已逾期 ${-item.days} 天` : item.days === 0 ? '就是今天' : `還有 ${item.days} 天`;
      return `
        <div style="border:1px solid var(--card-line); border-radius:8px; padding:10px 12px; margin-bottom:8px;">

const DISMISS_TODAY_KEY = 'wst_dismiss_until';
function checkDeadlineReminders(){
  const todayStr = todayLocalStr();
  if(localStorage.getItem(DISMISS_TODAY_KEY) === todayStr){
    const area0 = document.getElementById('deadlineNoticeArea');
    if(area0) area0.innerHTML = '';
    return;
  }
  deadlineNoticeList = [...computeDueSoonList(), ...computeReminderNoticeList()];
  const area = document.getElementById('deadlineNoticeArea');
  if(!area) return;
  if(deadlineNoticeList.length === 0){ area.innerHTML=''; return; }
  area.innerHTML = deadlineNoticeHtml(deadlineNoticeList);
  bindDeadlineNotice();
}
function bindDeadlineNotice(){
  document.getElementById('deadlineNoticeClose') && document.getElementById('deadlineNoticeClose').addEventListener('click', ()=>{
    document.getElementById('deadlineNoticeArea').innerHTML = '';
  });
  document.getElementById('deadlineNoticeDismissToday') && document.getElementById('deadlineNoticeDismissToday').addEventListener('click', ()=>{
    const todayStr = todayLocalStr();
    localStorage.setItem(DISMISS_TODAY_KEY, todayStr);
    document.getElementById('deadlineNoticeArea').innerHTML = '';
  });
  document.querySelectorAll('[data-goto-case]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const caseId = btn.dataset.gotoCase;
      document.getElementById('deadlineNoticeArea').innerHTML = '';
      activeTab = 'caseview';
      caseViewSelectedId = caseId;
      caseViewDetailTab = "basic";
      caseDropdownOpen = false;
      const c = state.cases.find(x=>x.id===caseId);
      caseViewStatusFilter = c ? c.status : "進行中";
      render();
    });
  });
  document.querySelectorAll('[data-ack-watch-case]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const caseId = btn.dataset.ackWatchCase;
      const reviewNo = btn.dataset.ackWatchReview;
      const date = btn.dataset.ackWatchDate;
      const p = getProgressForCase(caseId);
      if(p) p.ackWatch = {reviewNo, date};
      scheduleSave();
      deadlineNoticeList = deadlineNoticeList.filter(x => !(x.type==='watch' && x.caseId===caseId && String(x.reviewNo)===String(reviewNo)));
      const area = document.getElementById('deadlineNoticeArea');
      if(deadlineNoticeList.length===0){ area.innerHTML=''; } else { area.innerHTML = deadlineNoticeHtml(deadlineNoticeList); bindDeadlineNotice(); }
      render();
    });
  });
  document.querySelectorAll('[data-ack-reminder]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.ackReminder;
      const r = getReminders().find(x=>x.id===id);
      if(r) r.done = true;
      scheduleSave();
      deadlineNoticeList = deadlineNoticeList.filter(x => !(x.type==='reminder' && x.id===id));
      const area = document.getElementById('deadlineNoticeArea');
      if(deadlineNoticeList.length===0){ area.innerHTML=''; } else { area.innerHTML = deadlineNoticeHtml(deadlineNoticeList); bindDeadlineNotice(); }
      render();
    });
  });
}

function progressTableHtml(p){
  if(!p){
    return `<div class="card-hint" style="margin:0;">尚無資料</div>`;
  }
  const extensions = p.extensions || [];
  const watchInfo = getWatchDateForCase(p);
  const allRows = [
    ["掛件", null, p.filingDate, "", "", []],
    ["第1次審查", 1, p.review1, p.deadline1, p.revise1, extensions.filter(x=>String(x.reviewNo)==="1")],
    ["第2次審查", 2, p.review2, p.deadline2, p.revise2, extensions.filter(x=>String(x.reviewNo)==="2")],
    ["第3次審查", 3, p.review3, p.deadline3, p.revise3, extensions.filter(x=>String(x.reviewNo)==="3")],
    ["檢視本", null, p.viewCopy, "", "", []],
    ["定稿本", null, p.finalCopy, "", "", []],
  ];
  const rows = allRows.filter(([label, reviewNo, date, deadline, revise, exts]) => date || deadline || revise || exts.length);
  if(rows.length === 0){
    return `<div class="card-hint" style="margin:0;">尚無資料</div>`;
  }
  const body = rows.map(([label, reviewNo, date, deadline, revise, exts])=>{
    const extText = exts.length
      ? exts.map(x => `展延${x.date?'：'+escapeHtml(toROC(x.date)):''}${x.newDeadline?' →新期限 '+escapeHtml(toROC(x.newDeadline)):''}`).join('<br>')
      : '－';
    // 取展延紀錄中最新（日期最大）的新修正期限，作為目前實際生效的展延期限
    let latestNewDeadline = '';
    exts.forEach(x=>{
      if(x.newDeadline && x.newDeadline > latestNewDeadline) latestNewDeadline = x.newDeadline;
    });
    const extDeadlineCell = latestNewDeadline
      ? `<span style="color:var(--deadline-red); font-weight:700;">${escapeHtml(toROC(latestNewDeadline))}</span>`
      : '－';
    const isWatchedReview = watchInfo && reviewNo!=null && String(watchInfo.reviewNo)===String(reviewNo);
    const dateIsWatched = isWatchedReview && watchInfo.kind === '審查日期';
    const deadlineIsWatched = isWatchedReview && watchInfo.kind === '修正期限';
    const dateCell = date ? (dateIsWatched ? `<span style="color:var(--deadline-red); font-weight:700;">${escapeHtml(toROC(date))}</span>` : escapeHtml(toROC(date))) : '－';
    const deadlineCell = deadline ? (deadlineIsWatched ? `<span style="color:var(--deadline-red); font-weight:700;">${escapeHtml(toROC(deadline))}</span>` : escapeHtml(toROC(deadline))) : '－';
    const reviseCell = revise ? `<span style="color:var(--moss); font-weight:700;">${escapeHtml(toROC(revise))}</span>` : '－';
    return `<tr>
      <td class="readonly">${label}</td>
      <td class="readonly" style="white-space:nowrap;">${dateCell}</td>
      <td class="readonly" style="white-space:nowrap;">${deadlineCell}</td>
      <td class="readonly" style="white-space:nowrap;">${reviseCell}</td>
      <td class="readonly" style="white-space:nowrap;">${extDeadlineCell}</td>
      <td class="readonly">${extText}</td>
    </tr>`;
  }).join('');
  return `<div class="tbl-scroll"><table>
    <thead><tr><th>階段</th><th>日期</th><th>修正期限</th><th>修正本提送</th><th>展延期限</th><th>展延紀錄</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

/* ---- 04 結案獎金 ---- */
let bonusKpiYear = null;
function getAvailableBonusYears(){
  const years = new Set();
  state.cases.forEach(c=>{
    if(parseFloat(c.serviceFee) > 0 && c.paymentDate){
      years.add(c.paymentDate.slice(0,4));
    }
  });
  if(years.size === 0){
    years.add(String(new Date().getFullYear()));
  }
  return Array.from(years).sort((a,b)=> b.localeCompare(a));
}
function bonusKpiView(){
  const years = getAvailableBonusYears();
  if(!bonusKpiYear || !(years.includes(bonusKpiYear) || bonusKpiYear === '總覽')) bonusKpiYear = years[0];
  const isOverview = bonusKpiYear === '總覽';

  const paidThisYear = state.cases
    .filter(c=> parseFloat(c.serviceFee) > 0 && c.paymentDate && (isOverview || c.paymentDate.slice(0,4)===bonusKpiYear))
    .slice()
    .sort((a,b)=> (a.approvalDraftDate||'').localeCompare(b.approvalDraftDate||''));

  let totalFee = 0;
  const rows = paidThisYear.map((c,i)=>{
    const fee = parseFloat(c.serviceFee) || 0;
    totalFee += fee;
    const bonus = fee * 0.04;
    return `<tr>
      <td class="readonly computed" style="text-align:center;">${i+1}</td>
      <td class="readonly" style="white-space:normal;">${formatCaseNameHtml(c.name)}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.caseType||'')}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.approvalDraftDate||'')}</td>
      <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.paymentDate||'')}</td>
      <td class="readonly" style="white-space:nowrap; text-align:right;">${fee ? fee.toLocaleString() : '－'}</td>
      <td class="readonly" style="white-space:nowrap; text-align:right;">${fee ? bonus.toLocaleString(undefined,{maximumFractionDigits:0}) : '－'}</td>
    </tr>`;
  }).join('');
  const totalBonus = totalFee * 0.04;

  // 依「匯款月份」加總老闆每個月實際匯了多少獎金
  const monthlyMap = {};
  paidThisYear.forEach(c=>{
    const month = c.paymentDate.slice(0,7); // YYYY-MM
    const bonus = (parseFloat(c.serviceFee) || 0) * 0.04;
    monthlyMap[month] = (monthlyMap[month] || 0) + bonus;
  });
  const monthKeys = Object.keys(monthlyMap).sort();
  const monthlyRows = monthKeys.map(m=>`<tr>
    <td class="readonly">${m}</td>
    <td class="readonly" style="text-align:right;">${monthlyMap[m].toLocaleString(undefined,{maximumFractionDigits:0})}</td>
  </tr>`).join('');

  // 已結案、有服務費，但尚未填匯款時間的案子，列出來提醒
  const unpaid = state.cases.filter(c=> c.status==="已結案" && parseFloat(c.serviceFee) > 0 && !c.paymentDate);
  const unpaidRows = unpaid.map(c=>`<tr>
    <td class="readonly" style="white-space:normal;">${formatCaseNameHtml(c.name)}</td>
    <td class="readonly" style="white-space:nowrap;">${escapeHtml(c.approvalDraftDate||'')}</td>
    <td class="readonly" style="white-space:nowrap; text-align:right;">${(parseFloat(c.serviceFee)||0).toLocaleString()}</td>
  </tr>`).join('');

  const yearOptions = `<option value="總覽" ${isOverview?'selected':''}>總覽</option>` + years.map(y=>`<option value="${y}" ${y===bonusKpiYear?'selected':''}>${y}</option>`).join('');

  const salary = parseFloat(getYearSalary(bonusKpiYear)) || 0;
  const kpiTarget = salary * 36;
  const completionRate = kpiTarget > 0 ? (totalFee / kpiTarget * 100) : 0;
  const sectionLabel = isOverview ? '總覽' : `${bonusKpiYear} 年度`;

  return `
    <div class="card-top">
      <div><div class="card-title">結案獎金</div></div>
      <div class="cv-picker">
        <label style="font-size:11.5px; color:var(--ink-soft); white-space:nowrap;">年度</label>
        <select id="bonusYearSelect">${yearOptions}</select>
      </div>
    </div>

    ${isOverview ? '' : `
    <div class="cv-section" style="margin-top:0; padding-top:0; border-top:none;">
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}目標</span></div>
      <div class="cv-formgrid">
        <div class="cv-field"><label>${bonusKpiYear}年 月薪（元）</label><input type="text" inputmode="numeric" id="bonusSalaryInput" value="${formatMoneyDisplay(getYearSalary(bonusKpiYear))}" placeholder="請輸入該年度月薪"></div>
        <div class="cv-field"><label>年度目標（元＝月薪×36）</label><input type="text" value="${kpiTarget ? kpiTarget.toLocaleString() : '－'}" readonly></div>
        <div class="cv-field"><label>本年度已匯款服務費總額（元）</label><input type="text" value="${totalFee.toLocaleString()}" readonly></div>
        <div class="cv-field"><label>完成率</label><input type="text" value="${kpiTarget ? completionRate.toFixed(1)+'%' : '尚未設定月薪'}" readonly style="font-weight:700; color:${completionRate>=100?'var(--moss)':'var(--amber)'};"></div>
      </div>
      ${kpiTarget ? `
      <div style="margin-top:14px;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">
          <span>完成進度</span>
          <span style="font-weight:700; color:${completionRate>=100?'var(--moss)':'var(--amber)'};">${completionRate.toFixed(1)}%</span>
        </div>
        <div style="background:var(--grey-soft); border-radius:999px; height:16px; overflow:hidden; border:1px solid var(--card-line);">
          <div style="width:${Math.min(completionRate,100)}%; height:100%; background:${completionRate>=100?'var(--moss)':'var(--amber)'}; border-radius:999px; transition:width .3s;"></div>
        </div>
      </div>` : ''}
    </div>`}

    <div class="cv-section" ${isOverview ? 'style="margin-top:0; padding-top:0; border-top:none;"' : ''}>
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}已匯款獎金明細（依核定本日期排序，舊到新）</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>編號</th><th>案名</th><th>案件類型</th><th>核定本日期</th><th>匯款時間</th><th style="text-align:right;">服務費（元）</th><th style="text-align:right;">結案獎金（元）</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7" class="empty">尚無已匯款的案子</td></tr>`}</tbody>
        <tfoot><tr>
          <td class="readonly" colspan="2">${isOverview ? '總計' : '年度結案獎金總計'}</td><td class="readonly"></td><td class="readonly"></td><td class="readonly"></td>
          <td class="readonly" style="text-align:right;">${totalFee.toLocaleString()}</td>
          <td class="readonly" style="text-align:right; color:var(--moss);">${totalBonus.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
        </tr></tfoot>
      </table></div>
          </div>

    <div class="cv-section">
      <div class="cv-section-head"><span class="cv-section-title">${sectionLabel}每月匯款總表</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>月份</th><th style="text-align:right;">匯款金額（元）</th></tr></thead>
        <tbody>${monthlyRows || `<tr><td colspan="2" class="empty">尚無匯款紀錄</td></tr>`}</tbody>
      </table></div>
    </div>

    ${(!isOverview && unpaid.length) ? `
    <div class="cv-section">
      <div class="cv-section-head"><span class="cv-section-title">尚未填匯款時間（${unpaid.length}）</span></div>
      <div class="card-hint" style="margin-bottom:8px;">以下案子已結案、有填服務費，但還沒登記匯款時間，記得請老闆匯款後回來補上</div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>案名</th><th>核定本日期</th><th style="text-align:right;">服務費（元）</th></tr></thead>
        <tbody>${unpaidRows}</tbody>
      </table></div>
    </div>` : ''}`;
}

function caseView(){
  if(state.cases.length===0){
    return `
      <div class="card-top">
        <div><div class="card-title">各案總覽</div></div>
        <button class="btn" id="cvAddCase">＋ 新增案件</button>
      </div>
      <div class="empty">尚無案件，點右上角「＋ 新增案件」直接建立</div>`;
  }
  // 狀態篩選（決定目前顯示哪個案件）與關鍵字搜尋（只影響下拉選單的選項）分開處理，
  // 這樣打關鍵字時目前顯示的案件內容不會一直跳來跳去
  const statusFiltered = state.cases
    .filter(c => c.status === caseViewStatusFilter)
    .slice()
    .sort((a,b) => caseViewStatusFilter==="已結案"
      ? (b.actualClose||'').localeCompare(a.actualClose||'')
      : (b.updatedAt||0) - (a.updatedAt||0));
  if(!caseViewSelectedId || !statusFiltered.find(c=>c.id===caseViewSelectedId)){
    caseViewSelectedId = statusFiltered.length ? statusFiltered[0].id : null;
  }
  // 執行中／暫停案件數量通常不多，搜尋框只在「已結案」時顯示
  const searchEnabled = caseViewStatusFilter === "已結案";
  const kw = searchEnabled ? caseViewSearchKeyword.trim().toLowerCase() : "";
  const kwChars = kw ? Array.from(new Set(kw.replace(/\s+/g,'').split(''))) : [];
  const dropdownList = kwChars.length
    ? statusFiltered.filter(c=>{
        const target = (c.name||'').toLowerCase();
        return kwChars.every(ch => target.includes(ch));
      })
    : statusFiltered;
  const searchBoxHtml = searchEnabled
    ? `<input type="text" id="cvSearchInput" class="cv-search-input" placeholder="搜尋案名關鍵字" value="${escapeHtml(caseViewSearchKeyword)}">`

          <div class="card-title">各案總覽</div>

          <select id="cvStatusFilter">

            <option value="已結案" ${caseViewStatusFilter==="已結案"?'selected':''}>已結案</option>

          ${searchBoxHtml}
          ${caseDropdownHtml(dropdownList, null)}

      </div>
      <div class="empty">此分類尚無案件</div>`;

    .slice()
    .sort((a,b) => CONTACT_TYPE_ORDER.indexOf(a.type) - CONTACT_TYPE_ORDER.indexOf(b.type));
  const myProgressRec = getProgressForCase(c.id);
  const myMaterials = getMaterialsChecklist(c);
  const myReminders = getRemindersForCase(c.id).slice().sort((a,b)=> (a.date||'9999').localeCompare(b.date||'9999'));

  const contactCards = myContacts.map(x=>contactCardHtml(x)).join('');

  const materialsSummarySorted = myMaterials.slice().sort((a,b)=> Number(b.checked) - Number(a.checked));
  const materialsSummary = materialsSummarySorted.map(item=>`
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--card-line); font-size:13px;">
      <span>${escapeHtml(item.text)}</span>
      <span class="badge ${item.checked?'badge-moss-solid':'badge-grey'}">${item.checked?'已完成':'未收到'}</span>
    </div>`).join('');

  const reminderSummary = myReminders.map(r=>`
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--card-line); font-size:13px;">
